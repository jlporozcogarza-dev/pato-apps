<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Finanzas de Pato</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: una columna, tema coral y blanco (misma familia que el tracker). Límite del día → saldos → hoy → semana → mes → gráficas. */
:root{
  --bg:#131012; --surface:#1D191B; --surface-2:#262123; --line:#30292C; --track:#2D2629;
  --fg:#F6EFED; --muted:#A79CA0; --faint:#6E6468;
  --accent:#FF7B6B; --accent-soft:color-mix(in srgb, #FF7B6B 15%, #1D191B); --accent-line:color-mix(in srgb, #FF7B6B 38%, #30292C);
  --card-shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.28); --card-shadow-hi:0 2px 4px rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.38);
  --in:#2BCB69; --out:#FF5468; --mid:#F2C443; --limit:#3EA6FF; --card:#C77DFF;
  --in-bg:color-mix(in srgb, var(--in) 15%, var(--surface)); --out-bg:color-mix(in srgb, var(--out) 14%, var(--surface));
  --scrim:rgba(3,6,10,.64); --shadow:0 -12px 40px rgba(0,0,0,.45);
  --font-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F6F3F2; --surface:#FFFFFF; --surface-2:#F6F1EF; --line:#EDE6E3; --track:#F0E8E5;
    --fg:#1B1418; --muted:#7A6F74; --faint:#B0A5A9;
    --accent:#EE6656; --accent-soft:color-mix(in srgb, #EE6656 11%, #FFFFFF); --accent-line:color-mix(in srgb, #EE6656 32%, #EDE6E3);
    --card-shadow:0 1px 2px rgba(70,35,30,.05), 0 8px 24px rgba(70,35,30,.07); --card-shadow-hi:0 2px 4px rgba(70,35,30,.07), 0 16px 36px rgba(70,35,30,.13);
    --in:#17924A; --out:#D7384F; --mid:#C08A00; --limit:#0A7BD0; --card:#9B3FD1;
    --scrim:rgba(10,16,24,.36); --shadow:0 -12px 40px rgba(16,24,40,.16);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F6F3F2; --surface:#FFFFFF; --surface-2:#F6F1EF; --line:#EDE6E3; --track:#F0E8E5;
  --fg:#1B1418; --muted:#7A6F74; --faint:#B0A5A9;
    --accent:#EE6656; --accent-soft:color-mix(in srgb, #EE6656 11%, #FFFFFF); --accent-line:color-mix(in srgb, #EE6656 32%, #EDE6E3);
    --card-shadow:0 1px 2px rgba(70,35,30,.05), 0 8px 24px rgba(70,35,30,.07); --card-shadow-hi:0 2px 4px rgba(70,35,30,.07), 0 16px 36px rgba(70,35,30,.13);
  --in:#17924A; --out:#D7384F; --mid:#C08A00; --limit:#0A7BD0; --card:#9B3FD1;
  --scrim:rgba(10,16,24,.36); --shadow:0 -12px 40px rgba(16,24,40,.16);
  color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--font-body); font-size:15px; line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px 48px;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
a{color:inherit}
.app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;text-wrap:balance}
.sec-title{font-size:20px;letter-spacing:.02em}
[hidden]{display:none!important}
.pos{color:var(--in)} .neg{color:var(--out)} .zero{color:var(--faint)}

/* Encabezado */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:6px}
.top-l{min-width:0}
h1{font-size:42px;line-height:1;letter-spacing:.01em;margin-top:2px}
.sync{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0}
.dot.live{background:var(--in)} .dot.err{background:var(--out)}
.dot.busy{background:var(--mid);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.banner.warn{border-color:color-mix(in srgb, var(--mid) 55%, var(--line))}
.banner.err{border-color:color-mix(in srgb, var(--out) 55%, var(--line))}
.banner p{margin:0;min-width:0}
.banner button{flex-shrink:0;font-weight:600;padding:8px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}

/* Límite del día */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.ring-big{width:140px;height:140px;display:block}
.ring-big .k{font-family:var(--font-display);font-weight:600;font-size:11px;letter-spacing:.1em;fill:var(--muted)}
.ring-big .v{font-family:var(--font-display);font-weight:700;font-size:31px;fill:var(--fg)}
.ring-big .v.neg{fill:var(--out)}
.ring-big .s{font-family:var(--font-display);font-weight:500;font-size:13px;fill:var(--muted)}
.hstats{display:flex;flex-direction:column;gap:11px;min-width:0}
.hstat .k{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hstat .v{font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.hstat .v small{font-size:14px;color:var(--muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--in)} .pill.warn{color:var(--mid)} .pill.over{color:var(--out)}

/* Saldos */
.saldos{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);width:100%}
.saldos-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.saldo .k{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.saldo{min-width:0}
.saldo .v{font-family:var(--font-display);font-weight:700;font-size:clamp(16px,4.9vw,21px);line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit .bt{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.credit .bt b{color:var(--fg);font-weight:600}
.bar{position:relative;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--card)}
.missing{font-size:13px;color:var(--muted)}
.missing b{color:var(--mid);font-weight:600}

/* Listas de movimientos */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-head .lbl{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.addbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px}
.addbtn svg{width:15px;height:15px}
.navbtn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.navbtn svg{width:18px;height:18px}
.navbtn:disabled{opacity:.3}
.txs{display:flex;flex-direction:column;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.txhead{display:grid;grid-template-columns:minmax(0,1fr) 62px 104px;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.txhead span:nth-child(2),.txhead span:nth-child(3){text-align:right}
.tx{display:grid;grid-template-columns:minmax(0,1fr) 62px 104px;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%}
.tx:last-child{border-bottom:0}
button.tx:active{background:var(--surface-2)}
.tx-t{display:flex;flex-direction:column;min-width:0}
.tx-t b{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-t small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-h{text-align:right;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-a{text-align:right;font-family:var(--font-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-a.int{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted);margin-left:4px;vertical-align:1px}
.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tot{padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.tot .k{font-family:var(--font-display);font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tot .v{font-family:var(--font-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:18px 16px;text-align:center;color:var(--muted);font-size:14px}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 10px;border-radius:14px;background:var(--surface);border:1px solid transparent;min-width:0;min-height:96px}
.wd .wl{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--muted)}
.wd .wn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:3px}
.wd.today{border-color:var(--line)}
.wd.today .wn,.wd.today .wl{color:var(--fg);font-weight:700}
.wd .a{font-family:var(--font-display);font-weight:700;font-size:13.5px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip}
.wd .a.none{color:var(--faint);font-weight:500}
.wd.future{opacity:.4}
.wd.over{background:var(--out-bg)}

/* Mes */
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:6px}
.dow span{text-align:center;font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--faint)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mc{position:relative;aspect-ratio:1/1.08;max-width:100%;border-radius:11px;background:var(--surface);border:1px solid transparent;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;min-width:0}
.mc .d{position:absolute;top:4px;left:6px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.mc .s{font-family:var(--font-display);font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mc.has-pos{background:var(--in-bg)} .mc.has-neg{background:var(--out-bg)}
.mc.today{border-color:var(--fg)} .mc.today .d{color:var(--fg);font-weight:700}
.mc.future{opacity:.35}
.mc.blank{background:none}

/* Gráficas */
.charts{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.chart{position:relative;padding:14px 14px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.chart h3{font-size:17px;letter-spacing:.02em}
.chart .sub{font-size:13px;color:var(--muted);margin:2px 0 8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{font-family:var(--font-display);font-weight:500;font-size:11px;fill:var(--muted)}
.chart .ax.hl{fill:var(--fg);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--faint);stroke-width:1}
.chart .lim{stroke:var(--limit);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.chart .lbl{font-family:var(--font-display);font-weight:600;font-size:11.5px;fill:var(--fg)}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:color-mix(in srgb, var(--fg) 5%, transparent)}
.chart .xh{stroke:var(--muted);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.dash{height:0;width:14px;border-radius:0;border-top:2px dashed var(--limit)}
.legend i.ln{height:2px;width:14px;border-radius:2px}
.tip{position:absolute;z-index:5;pointer-events:none;padding:8px 10px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:12.5px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.3);white-space:nowrap}
.tip b{font-weight:600}
.cats{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.cat{display:grid;grid-template-columns:minmax(0,118px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.cat .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .t{height:10px;border-radius:0 4px 4px 0;background:var(--track);overflow:hidden}
.cat .t i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--out)}
.cat .v{font-family:var(--font-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:12.5px;color:var(--faint);margin:10px 0 0}
.foot{font-size:12.5px;color:var(--faint);text-align:center}
.foot a{color:var(--muted)}

/* Hoja inferior */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:520px;
  max-height:92dvh;overflow:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow);border:1px solid var(--line);border-bottom:0;
  padding-top:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
}
.sheet.open{transform:none}
.sheet .txs{background:var(--surface-2)}
.sheet .tot{background:var(--surface-2)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sh-head h3{font-size:28px;line-height:1.05;margin-top:2px}
.sh-body{display:flex;flex-direction:column;gap:16px}
.sh-actions{display:flex;gap:10px;margin-top:4px}
.btn{flex:1;padding:14px;border-radius:14px;font-weight:600;font-size:16px;text-align:center;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.danger{color:var(--out)}
.btn.danger.confirm{background:var(--out);color:#fff;border-color:var(--out)}
.btn:disabled{opacity:.5}
.xbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--surface-2);flex-shrink:0}
.xbtn svg{width:15px;height:15px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{padding:10px 6px;border-radius:10px;text-align:center;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.amount{display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.amount .sg{font-family:var(--font-display);font-weight:700;font-size:38px;width:22px;text-align:center}
.amount input{flex:1;min-width:0;font-family:var(--font-display);font-weight:700;font-size:38px;background:none;border:0;color:var(--fg);padding:0;font-variant-numeric:tabular-nums}
.amount input:focus{outline:none}
.amount:focus-within{border-color:var(--muted)}
.grp{display:flex;flex-direction:column;gap:9px}
.grp-h{font-family:var(--font-display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 13px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-weight:500;font-size:14.5px}
.chip[aria-pressed="true"]{border-color:var(--fg);background:color-mix(in srgb, var(--fg) 12%, var(--surface-2))}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input{width:100%;min-width:0;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg)}
.field input:focus{outline:2px solid var(--muted);outline-offset:0;border-color:transparent}
.hint{font-size:13px;color:var(--muted);margin:0}
.kv{display:flex;flex-direction:column;border-radius:16px;border:1px solid var(--line);overflow:hidden}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px}
.kv div:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right;overflow-wrap:anywhere;min-width:0}
.acct{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:13px 14px;border-bottom:1px solid var(--line)}
.acct:last-child{border-bottom:0}
.acct .an{font-weight:600;font-size:16px}
.acct .av{font-family:var(--font-display);font-weight:700;font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
.acct .ad{grid-column:1/-1;font-size:13px;color:var(--muted)}
/* Programados */
.tx.pg,.txhead.pg{grid-template-columns:minmax(0,1fr) 78px 96px}
.tx.pg .tx-h{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.tx.pg .tx-h b{color:var(--fg);font-weight:600;font-size:14px}
.tx.pg .tx-h small{font-size:12px;color:var(--muted)}
.tx.pg.off{opacity:.5}

function parseDT(v){
  const s = String(v==null?"":v).trim().replace(/^'/,"");
  if (!s) return null;
  if (/^\d{5}(\.\d+)?$/.test(s)){ const n = Number(s); const f = normDate(n); return f ? dtVal(f, normTime(String(n%1 ? n%1 : 0))) : null; }
  const parts = s.split(/\s+/), f = normDate(parts[0]);
  return f ? dtVal(f, normTime(parts.slice(1).join(" "))) : null;
}
function applyProgs(values){
  const list = [];
  (values||[]).forEach((r,i)=>{
    if (!i || !r || !r[0]) return;
    const monto = num(r[4]), dia = parseInt(String(r[5]||"").replace(/[^\d]/g,""),10);
    list.push({ id:String(r[0]).trim(), concepto:String(r[1]||"").trim(), cat:canonCat(String(r[2]||"").trim()), cuenta:canonAcct(String(r[3]||"").trim()),
      monto: isFinite(monto) ? monto : null, dia: dia>=1 && dia<=31 ? dia : null, frec: strip(r[6])==="anual" ? "anual" : "mensual",
      desde: normDate(r[7]), hasta: normDate(r[8]), activo: strip(r[9])!=="no", notas:String(r[10]||"").trim(), row:i+1 });
  });
  S.progs = list;
}
const mkey = m => [m.fecha, m.hora, strip(m.concepto), m.monto].join("|");
function applyCuentas(values){
  const list = [];

function applyConfig(values){

  const lim = num(get("Límite diario"));

  const cats = [];

function applyRules(values){

/* ---------- Reglas de categoría ---------- */
/* La regla gana si su texto aparece en el concepto (sin mayúsculas ni acentos); si varias coinciden, gana la más larga. */
function matchRule(concepto){
  const c = strip(concepto); if (!c) return null;
  let best = null, bl = 0;
  for (const r of S.rules){ const p = strip(r.pat); if (p && c.includes(p) && p.length>bl){ best = r; bl = p.length; } }
  return best;
}
/* Sin regla: lo que usaste la última vez con el mismo concepto */
function lastLike(concepto){
  const c = strip(concepto); if (!c) return null;
  let best = null;
  for (const m of S.movs){ if (m.cat && !isInterno(m) && strip(m.concepto)===c && (!best || dtVal(m.fecha,m.hora) > dtVal(best.fecha,best.hora))) best = m; }
  return best;
}
function chipsHtml(list, sel, attr){
  return list.length ? list.map(n=>'<button class="chip" '+attr+'="'+esc(n)+'" aria-pressed="'+(n===sel)+'">'+esc(n)+(isCredit(n) && strip(n)!=="credito"?'<span class="tag">crédito</span>':'')+'</button>').join("") : '<span class="hint">Sin opciones todavía.</span>';
}

/* ---------- Cálculos ---------- */
let C = null;
function compute(){
  const today = todayStr();
  const byDay = {};
  for (const m of S.movs){
    const d = byDay[m.fecha] || (byDay[m.fecha] = { inc:0, out:0, limOut:0, progOut:0, list:[] });
    d.list.push(m);
    if (isInterno(m)) continue;
    if (m.monto>0) d.inc += m.monto;
    else {
      d.out += -m.monto;
      if (m.origen==="Programado") d.progOut += -m.monto;
      if (S.cfg.progLimite || m.origen!=="Programado") d.limOut += -m.monto;
    }
  }
  for (const k in byDay) byDay[k].list.sort((a,b)=> hmMin(a.hora)-hmMin(b.hora) || a.row-b.row);
  const corte = S.cfg.corteFecha ? dtVal(S.cfg.corteFecha, S.cfg.corteHora) : -Infinity;
  const cuentas = S.cuentas.map(c=>{
    let sum = 0; const ct = c.corte!=null ? c.corte : corte;
    for (const m of S.movs) if (strip(m.cuenta)===strip(c.nombre) && dtVal(m.fecha,m.hora)>=ct) sum += m.monto;
    const credit = strip(c.tipo)==="credito";
    const actual = c.saldo==null ? null : credit ? c.saldo-sum : c.saldo+sum;
    return Object.assign({}, c, { credit, sum, actual });
  });
  const dinero = cuentas.filter(c=>!c.credit && c.actual!=null).reduce((a,c)=>a+c.actual,0);
  const deuda = cuentas.filter(c=>c.credit && c.actual!=null).reduce((a,c)=>a+c.actual,0);
  const linea = cuentas.filter(c=>c.credit && c.linea).reduce((a,c)=>a+c.linea,0);
  const missing = cuentas.filter(c=>c.actual==null).map(c=>c.nombre);
  const lim = S.cfg.limite, inicio = S.cfg.inicio || today;
  const dias = Math.max(0, diffDays(inicio, today) + 1);
  let gastado = 0;
  for (let k=0;k<dias;k++){ const d = byDay[addDays(inicio,k)]; if (d) gastado += d.limOut; }
  const acum = lim*dias, puedes = acum - gastado;
  const hoyOut = byDay[today] ? byDay[today].limOut : 0;
  const dispHoy = puedes + hoyOut;
  C = { today, byDay, cuentas, dinero, deuda, linea, missing, lim, inicio, dias, acum, gastado, puedes, hoyOut, dispHoy };
}
const dayAgg = d => (C.byDay[d] || { inc:0, out:0, limOut:0, progOut:0, list:[] });
function rangeAgg(from, to){ let inc=0,out=0,limOut=0; for (let d=from; d<=to; d=addDays(d,1)){ const a=C.byDay[d]; if(a){ inc+=a.inc; out+=a.out; limOut+=a.limOut; } } return {inc,out,limOut,net:inc-out}; }

/* ---------- Programados ---------- */
const daysIn = (y,m) => new Date(y,m,0).getDate();
function occurrences(p, from, to){
  const out = [];
  if (!p.dia || !p.id) return out;
  if (p.frec==="anual" && !p.desde) return out;
  const start = p.desde && p.desde > from ? p.desde : from;
  const end = p.hasta && p.hasta < to ? p.hasta : to;
  if (start > end) return out;
  let [y,m] = start.split("-").map(Number); const [ey,em] = end.split("-").map(Number);
  for (let g=0; (y<ey || (y===ey && m<=em)) && g<480; g++){
    if (p.frec!=="anual" || m===+p.desde.slice(5,7)){
      const d = y+"-"+pad(m)+"-"+pad(Math.min(p.dia, daysIn(y,m)));
      if (d>=start && d<=end) out.push({ p, fecha:d, id:"prog-"+p.id+"-"+(p.frec==="anual" ? String(y) : y+"-"+pad(m)) });
    }
    m++; if (m>12){ m=1; y++; }
  }
  return out;
}
/* Cobros que ya tocaron y no están en Movimientos */
function dueCharges(){
  const today = todayStr(), list = [];
  for (const p of S.progs){
    if (!p.activo || p.monto==null || Math.abs(p.monto)<0.005) continue;
    for (const o of occurrences(p, addDays(today,-400), today)) if (!S.movIds.has(o.id)) list.push(o);
  }
  return list;
}
/* Cobros por venir (incluye los que aún no tienen monto) */
function upcoming(from, to){
  const list = [];
  for (const p of S.progs){
    if (!p.activo) continue;
    for (const o of occurrences(p, from, to)) if (!S.movIds.has(o.id)) list.push(o);
  }
  return list.sort((a,b)=> a.fecha<b.fecha ? -1 : a.fecha>b.fecha ? 1 : 0);
}
function schedByDay(from, to){
  const map = {};
  for (const o of upcoming(from, to)){ (map[o.fecha] || (map[o.fecha] = [])).push(o); }
  return map;
}
const nextOcc = p => upcoming(todayStr(), addDays(todayStr(), 400)).find(o=>o.p===p) || null;
function monthAgg(k){ let inc=0,out=0; const cats={}; for (const d in C.byDay){ if (d.slice(0,7)!==k) continue; const a=C.byDay[d]; inc+=a.inc; out+=a.out; for (const m of a.list){ if (m.monto<0 && !isInterno(m)){ const c=m.cat||"Sin categoría"; cats[c]=(cats[c]||0)-m.monto; } } } return {inc,out,net:inc-out,cats}; }

/* ---------- Presupuestos por categoría ---------- */
/* Tope mensual por categoría. Si "Presupuestos acumulan" = Sí, lo que sobra (o lo que te pasas) de cada mes
   desde "Inicio de presupuestos" se suma (o se resta) al tope del mes siguiente. */
function budgetFor(k){
  const aggs = {}, agg = j => aggs[j] || (aggs[j] = monthAgg(j).cats);
  const start = S.cfg.presInicio ? monthKey(S.cfg.presInicio) : k;
  const list = [];
  for (const c of S.cats){
    if (!c.pres || c.tipo!=="Egreso") continue;
    let carry = 0;
    if (S.cfg.presAcum) for (let j=start; j<k; j=shiftMonth(j,1)) carry += c.pres - (agg(j)[c.nombre]||0);
    list.push({ cat:c.nombre, pres:c.pres, carry, avail:c.pres+carry, spent:agg(k)[c.nombre]||0 });
  }
  return { list, spentBy:agg(k) };
}

/* ---------- Conector de Google Sheets ---------- */
function valuesOf(res){
  let p = res && (res.payload !== undefined ? res.payload : res);
  if (typeof p === "string"){ try{ p=JSON.parse(p); }catch(e){ p=null; } }
  if (p && Array.isArray(p.values)) return p.values;
  if (p && p.result && Array.isArray(p.result.values)) return p.result.values;
  const t = res && Array.isArray(res.content) && res.content.find(c=>c.type==="text");
  if (t){ try{ const j=JSON.parse(t.text); if (Array.isArray(j.values)) return j.values; }catch(e){} }
  return [];
}
const call = (tool,input) => S.mcp.callTool(SERVER, tool, input, { cache:false });

    throw e;
  }
}

let loading = null;
function loadAll(){
  if (!S.mcp) return Promise.resolve();
  if (loading) return loading;
  setBusy(1); S.reading = true;
  loading = (async()=>{
    try{
      // Al abrir se muestra al instante lo último guardado en este dispositivo mientras llegan los datos nuevos.
      const k = S.mode!=="live" && cacheGet();
      if (k){ applyConfig(k.cf); applyCuentas(k.cu); applyMovs(k.mv); applyProgs(k.pg); applyRules(k.rl); S.rulesSheet = k.rs; S.mode = "live"; render(); }
      // Programados y Reglas son opcionales: si la pestaña no existe (tool_error) se usa null.
      const opt = p => p.catch(e => { if (!e || e.code!=="tool_error") throw e; return null; });
      const [mv, cu, cf, pg0, rl0] = await Promise.all([ read("Movimientos!A:I"), read("Cuentas!A1:I20"), read("Config!A1:G60"),
        opt(read("Programados!A1:L200")), opt(read("Reglas!A1:C200")) ]);
      const pg = pg0 || [], rl = rl0 || [];
      S.rulesSheet = rl0 !== null;
      applyConfig(cf); applyCuentas(cu); applyMovs(mv); applyProgs(pg); applyRules(rl);
      S.mode = "live"; S.banner = null;
      cacheSet({ mv, cu, cf, pg, rl, rs: S.rulesSheet });
    }catch(e){

      if (S.mode!=="live" || info.retract) S.mode = "error";
      S.banner = { t:info.t, msg:info.msg, btn:info.btn };
    }finally{
      loading = null; S.reading = false; setBusy(-1); render(); refreshSheet();
      if (S.mode==="live") chargeDue();
    }
  })();
  return loading;
}

/* Presupuestos: tope en Config columna G (junto a cada categoría) y dos ajustes en Config A:B */
function saveBudgets(vals, acum){
  const prevCats = S.cats.map(c=>Object.assign({}, c)), prevCfg = Object.assign({}, S.cfg);
  const undo = () => { S.cats = prevCats; S.cfg = prevCfg; render(); };
  S.cats = S.cats.map(c=> c.nombre in vals ? Object.assign({}, c, { pres:vals[c.nombre] }) : c);
  S.cfg = Object.assign({}, S.cfg, { presAcum:acum, presInicio: S.cfg.presInicio || C.today.slice(0,8)+"01" });
  render();
  if (S.mode!=="live"){ if (S.mode!=="example") undo(); toast(offlineMsg()); return; }
  if (!prevCats.some(c=>c.row)){ undo(); toast("Tus categorías no están en la hoja Config. Agrégalas ahí primero."); return; }
  setBusy(1);
  enqueue(async()=>{
    try{
      const cf = await read("Config!A1:G60");
      const names = Object.keys(vals);
      const col = cf.map((r,i)=>{
        if (!i) return ["Presupuesto mensual"];
        const n = r && r[4] ? String(r[4]).trim() : "", hit = n && names.find(k=>strip(k)===strip(n));
        return [hit ? (vals[hit]==null ? "" : vals[hit]) : (r && r[6]!=null ? r[6] : "")];
      });
      await call("update_values", { spreadsheetId:SHEET_ID, range:"Config!G1:G"+col.length, values:col });
      const keys = [["Presupuestos acumulan", acum ? "Sí" : "No"]];
      if (!prevCfg.presInicio) keys.push(["Inicio de presupuestos", S.cfg.presInicio]);
      let free = 2; const used = new Set();
      for (const [label, value] of keys){
        let row = 0; cf.forEach((r,i)=>{ if (i && r && strip(r[0])===strip(label)) row = i+1; });
        if (!row){ while ((cf[free-1] && cf[free-1][0]) || used.has(free)) free++; row = free; used.add(row); }
        await call("update_values", { spreadsheetId:SHEET_ID, range:"Config!A"+row+":B"+row, values:[["'"+label, value]] });
      }
      applyConfig(await read("Config!A1:G60"));
      toast("Presupuestos guardados");
    }catch(e){ undo(); writeFailed(e); }
    finally{ setBusy(-1); render(); refreshSheet(); }
  });
}

function deleteMov(m){

  const targets = S.movs.filter(x => x===m || (group && x.id && x.id.slice(0,-1)===group));

  if (S.mode!=="live"){ if (S.mode==="example") toast("Vista de ejemplo: esto no se guarda en tu hoja."); return; }
  keys.forEach(k=>pendingDeletes.add(k));
  setBusy(1);
  enqueue(async()=>{
    try{
      const vals = await read("Movimientos!A:I");
      const rows = [];
      targets.forEach(t=>{
        let best = 0;
        vals.forEach((r,i)=>{
          if (!i || !r) return;
          const id = String(r[8]||"").trim();
          if (t.id){ if (id===t.id) best = i+1; return; }
          const g = { fecha:normDate(r[0]), hora:normTime(r[1]), concepto:String(r[2]||"").trim(), monto:num(r[5]) };
          if (g.fecha && mkey(g)===mkey(t) && (!best || Math.abs(i+1-t.row) < Math.abs(best-t.row))) best = i+1;
        });
        if (best && !rows.includes(best)) rows.push(best);
      });
      rows.sort((a,b)=>b-a);
      if (rows.length){
        await call("update_spreadsheet", { spreadsheetId:SHEET_ID, requests: rows.map(r=>({ deleteDimension:{ range:{ sheetId:MOV_GID, dimension:"ROWS", startIndex:r-1, endIndex:r } } })) });
      }
      keys.forEach(k=>pendingDeletes.delete(k));
      applyMovs(await read("Movimientos!A:I"));
      toast(rows.length>1 ? "Se borraron los dos movimientos del pago" : "Movimiento borrado");
    }catch(e){ keys.forEach(k=>pendingDeletes.delete(k)); writeFailed(e); }
    finally{ setBusy(-1); render(); refreshSheet(); }
  });
}

function ring(size, stroke, pct, color, inner){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct)));
  return '<svg class="ring-big" viewBox="0 0 '+size+' '+size+'" aria-hidden="true">'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+stroke+'"/>'
    + (pct>0 ? '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>' : '')
    + inner + '</svg>';
}

/* ---------- Gráficas ---------- */
function nice(v){ if (v<=0) return 0; const p=Math.pow(10,Math.floor(Math.log10(v))), f=v/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function barPath(x,y0,y1,w,r){
  const up = y1<y0, h=Math.abs(y0-y1); r=Math.min(r,h,w/2);
  return up ? 'M'+x+','+y0+'V'+(y1+r)+'Q'+x+','+y1+' '+(x+r)+','+y1+'H'+(x+w-r)+'Q'+(x+w)+','+y1+' '+(x+w)+','+(y1+r)+'V'+y0+'Z'
            : 'M'+x+','+y0+'V'+(y1-r)+'Q'+x+','+y1+' '+(x+r)+','+y1+'H'+(x+w-r)+'Q'+(x+w)+','+y1+' '+(x+w)+','+(y1-r)+'V'+y0+'Z';
}
const kMoney = v => { const a=Math.abs(v); const s = a>=1000 ? "$"+(Math.round(a/100)/10).toLocaleString("es-MX")+"k" : "$"+Math.round(a); return (v<0?MINUS:"")+s; };
function divChart(items, opt){
  const W=340, H=200, L=44, R=6, T=12, B=26;
  const maxIn = Math.max(0, ...items.map(i=>i.inc));
  const maxOut = Math.max(0, ...items.map(i=>i.out), opt.limit||0);
  if (!items.some(i=>i.inc>0.004||i.out>0.004)) return '<div class="empty">'+esc(opt.empty)+'</div>';
  let top = nice(maxIn), bot = nice(maxOut);
  const span = top+bot || 1, ph = H-T-B;
  const y = v => T + (top - v)/span*ph;
  const y0 = y(0);
  const band = (W-L-R)/items.length, bw = Math.min(22, band*0.55);
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.aria)+'">';
  if (top>0) s += '<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(top)+'" y2="'+y(top)+'"/>' + (y0-y(top)>=14 ? '<text class="ax" x="'+(L-6)+'" y="'+(y(top)+4)+'" text-anchor="end">+'+kMoney(top)+'</text>' : '');
  if (bot>0) s += '<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(-bot)+'" y2="'+y(-bot)+'"/>' + (y(-bot)-y0>=14 ? '<text class="ax" x="'+(L-6)+'" y="'+(y(-bot)+4)+'" text-anchor="end">'+kMoney(-bot)+'</text>' : '');
  s += '<text class="ax" x="'+(L-6)+'" y="'+(y0+4)+'" text-anchor="end">$0</text>';
  items.forEach((it,i)=>{
    const x = L + band*i + (band-bw)/2;
    if (it.inc>0.004){ const yt = Math.min(y(it.inc), y0-3); s += '<path d="'+barPath(x,y0-1,yt,bw,4)+'" fill="var(--in)"/>'; }
    if (it.out>0.004){ const yb = Math.max(y(-it.out), y0+3); s += '<path d="'+barPath(x,y0+1,yb,bw,4)+'" fill="var(--out)"/>'; }
    s += '<text class="ax'+(it.hl?' hl':'')+'" x="'+(L+band*i+band/2)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(it.label)+'</text>';
  });
  s += '<line class="base" x1="'+L+'" x2="'+(W-R)+'" y1="'+y0+'" y2="'+y0+'"/>';
  if (opt.limit){ const yl=y(-opt.limit); s += '<line class="lim" x1="'+L+'" x2="'+(W-R)+'" y1="'+yl+'" y2="'+yl+'"/>'; }
  items.forEach((it,i)=>{ s += '<rect class="hit" x="'+(L+band*i)+'" y="'+T+'" width="'+band+'" height="'+ph+'" data-tip="'+esc(it.tip)+'"/>'; });
  return s + '</svg>';
}
function tipFor(title, inc, out){
  return '<b>'+esc(title)+'</b><br>Ingresos '+money(inc,{sign:true})+'<br>Egresos '+money(-out,{sign:true})+'<br>Neto '+money(inc-out,{sign:true});
}
function lineChart(){
  const to = C.today, from = C.inicio > addDays(to,-29) ? C.inicio : addDays(to,-29);
  const n = diffDays(from,to)+1;
  if (n<1) return '<div class="empty">El límite empieza el '+esc(longDate(C.inicio))+'.</div>';
  const W=340, H=190, L=44, R=78, T=14, B=26;
  const startK = diffDays(C.inicio, from);
  const pts = []; let spent = 0;
  for (let k=0;k<startK;k++){ const a=C.byDay[addDays(C.inicio,k)]; if (a) spent += a.limOut; }
  for (let i=0;i<n;i++){ const d=addDays(from,i), a=C.byDay[d]; if (a) spent += a.limOut; pts.push({ d, lim:C.lim*(startK+i+1), spent }); }
  const max = nice(Math.max(...pts.map(p=>Math.max(p.lim,p.spent))));
  const x = i => n===1 ? L+(W-L-R)/2 : L + i*(W-L-R)/(n-1);
  const y = v => T + (1 - v/max)*(H-T-B);
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Límite acumulado contra gastado acumulado">';
  [0, max/2, max].forEach(v=>{ s += '<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+kMoney(v)+'</text>'; });
  const path = key => pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p[key]).toFixed(1)).join("");
  if (n>1){
    s += '<path d="'+path("lim")+'" fill="none" stroke="var(--limit)" stroke-width="2" stroke-linejoin="round"/>';
    s += '<path d="'+path("spent")+'" fill="none" stroke="var(--out)" stroke-width="2" stroke-linejoin="round"/>';
  }
  const last = pts[pts.length-1], lx = x(n-1);
  let yl = y(last.lim), ys = y(last.spent);
  s += '<circle cx="'+lx+'" cy="'+yl+'" r="4.5" fill="var(--limit)" stroke="var(--surface)" stroke-width="2"/>';
  s += '<circle cx="'+lx+'" cy="'+ys+'" r="4.5" fill="var(--out)" stroke="var(--surface)" stroke-width="2"/>';
  let tl = yl+4, ts = ys+4;
  if (Math.abs(tl-ts)<26){ if (yl<=ys){ ts = tl+26; } else { tl = ts+26; } }
  const lblX = lx+10;
  s += '<text class="lbl" x="'+lblX+'" y="'+(tl-7)+'">Límite</text><text class="ax" x="'+lblX+'" y="'+(tl+7)+'">'+esc(money(last.lim,{dec:false}))+'</text>';
  s += '<text class="lbl" x="'+lblX+'" y="'+(ts-7)+'">Gastado</text><text class="ax" x="'+lblX+'" y="'+(ts+7)+'">'+esc(money(last.spent,{dec:false}))+'</text>';
  const ticks = n===1 ? [0] : n<=8 ? pts.map((_,i)=>i) : [0, Math.floor((n-1)/2), n-1];
  ticks.forEach(i=>{ const d=parseYmd(pts[i].d); s += '<text class="ax" x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+d.getDate()+' '+MON_S[d.getMonth()]+'</text>'; });
  s += '<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" visibility="hidden"/>';
  const hw = n===1 ? (W-L-R) : (W-L-R)/(n-1);
  pts.forEach((p,i)=>{
    const tip = '<b>'+esc(shortDate(p.d))+'</b><br>Límite acumulado '+money(p.lim,{dec:false})+'<br>Gastado '+money(p.spent)+'<br>'+(p.lim-p.spent>=0?'Te quedaban ':'Te pasaste ')+money(Math.abs(p.lim-p.spent));
    s += '<rect class="hit" x="'+(x(i)-hw/2)+'" y="'+T+'" width="'+hw+'" height="'+(H-T-B)+'" data-cx="'+x(i).toFixed(1)+'" data-tip="'+esc(tip)+'"/>';
  });
  return s + '</svg>';
}
function catBars(){

  const max = list[0][1], total = list.reduce((a,c)=>a+c[1],0);
  return '<div class="cats">' + list.map(([c,v])=>'<div class="cat" data-tip="'+esc('<b>'+esc(c)+'</b><br>'+money(-v,{sign:true})+' · '+Math.round(v/total*100)+'% de tus egresos')+'">'
    + '<span class="n">'+esc(c)+'</span><span class="t"><i style="width:'+(v/max*100).toFixed(1)+'%"></i></span><span class="v">'+money(-v,{sign:true,dec:false})+'</span></div>').join("") + '</div>';
}

function hideTips(except){
  document.querySelectorAll(".chart .tip").forEach(t=>{ if (t!==except) t.hidden=true; });
  document.querySelectorAll(".chart .xh").forEach(l=>{ if (!except || !except.parentNode.contains(l)) l.setAttribute("visibility","hidden"); });
}
function onTip(e){
  const hit = e.target.closest && e.target.closest(".chart [data-tip]");
  if (!hit){ hideTips(); return; }
  const ch = hit.closest(".chart"), tip = ch.querySelector(".tip");
  tip.innerHTML = hit.dataset.tip; tip.hidden = false; hideTips(tip);
  const r = ch.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let px = e.clientX - r.left, py = e.clientY - r.top;
  const svg = hit.ownerSVGElement;
  if (svg && hit.dataset.cx){
    const xh = svg.querySelector(".xh");
    xh.setAttribute("x1", hit.dataset.cx); xh.setAttribute("x2", hit.dataset.cx); xh.setAttribute("visibility","visible");
  }
  let left = Math.max(6, Math.min(r.width - tw - 6, px - tw/2));
  let top = py - th - 14; if (top < 4) top = py + 18;
  tip.style.left = left+"px"; tip.style.top = top+"px";
}
document.addEventListener("pointermove", e=>{ if (e.pointerType==="mouse") onTip(e); });
document.addEventListener("pointerdown", onTip);

/* ---------- Hoja inferior ---------- */
let sheetKind=null, sheetState=null, lastFocus=null, sheetArg=null;
function openSheet(kind, arg){
  sheetKind=kind; sheetArg=arg; lastFocus=document.activeElement;
  const sh=$("sheet"), sc=$("scrim");
  sh.hidden=false; sc.hidden=false;
  buildSheet();
  document.body.style.overflow="hidden";
  requestAnimationFrame(()=>{ sh.classList.add("open"); sc.classList.add("open"); const f = sh.querySelector("[data-autofocus]") || sh.querySelector("button"); if (f) f.focus({preventScroll:true}); });
}
function closeSheet(){
  const sh=$("sheet"), sc=$("scrim");
  sh.classList.remove("open"); sc.classList.remove("open");
  document.body.style.overflow="";
  sheetKind=null; sheetState=null; sheetArg=null;
  setTimeout(()=>{ if (!sheetKind){ sh.hidden=true; sc.hidden=true; sh.innerHTML=""; } }, 260);
  if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
}
function head(eyebrow, title){

}
function buildSheet(){
  const sh=$("sheet");
  if (sheetKind==="day") buildDay(sh, sheetArg);
  else if (sheetKind==="add") buildAdd(sh, sheetArg);
  else if (sheetKind==="mov") buildMov(sh, sheetArg);
  else if (sheetKind==="cuentas") buildCuentas(sh);
  else if (sheetKind==="prog") buildProg(sh, sheetArg);
  else if (sheetKind==="rule") buildRule(sh, sheetArg);
  else if (sheetKind==="bud") buildBud(sh);

function refreshSheet(){
  if (!sheetKind) return;

    extra = '<p class="hint">'+(isT?'Hoy tienes ':'Ese día tenías ')+money(Math.max(dispUntil,0),{dec:false})+' disponibles con el acumulado y '+(left>=0?(isT?'te quedan':'te sobraron')+' <b class="pos">'+money(left,{dec:false})+'</b>.':'te pasaste <b class="neg">'+money(-left,{dec:false})+'</b>.')+'</p>';
  }

      const data = { concepto, cat:st.cat, cuenta:st.cuenta||"", monto, dia, frec:st.frec, desde, hasta: p ? p.hasta : null, activo: st.activo };

      saveProg(p, data);
    },
    pdel(){ const b=$("pDelBtn"); if (!armed){ armed=true; b.classList.add("confirm"); b.textContent="Toca otra vez para borrar"; return; } closeSheet(); deleteProg(p); }
  };
}
const slug = s => strip(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24) || "pago";
function progRow(d){ return [txt(d.concepto), txt(d.cat), txt(d.cuenta), d.monto==null ? "" : d.monto, d.dia, d.frec==="anual" ? "Anual" : "Mensual", d.desde, d.hasta || "", d.activo ? "Sí" : "No"]; }
async function progRowNum(id){
  const vals = await read("Programados!A1:A200");
  for (let i=1;i<vals.length;i++) if (vals[i] && String(vals[i][0]||"").trim()===id) return i+1;
  return 0;
}
function saveProg(p, d){
  if (S.mode!=="live"){ toast(S.mode==="example" ? "Vista de ejemplo: esto no se guarda en tu hoja." : "Sin conexión con tu hoja. Toca Reintentar arriba."); return; }
  setBusy(1);
  enqueue(async()=>{
    try{
      if (p){
        const row = await progRowNum(p.id);
        if (!row) throw { code:"tool_error", message:"No encontré ese programado en la hoja." };
        await call("update_values", { spreadsheetId:SHEET_ID, range:"Programados!B"+row+":J"+row, values:[progRow(d)] });
      } else {
        const id = slug(d.concepto) + "-" + Math.random().toString(36).slice(2,6);
        await call("append_values", { spreadsheetId:SHEET_ID, range:"Programados!A1", values:[["'"+id].concat(progRow(d), ["'Agregado desde la app", PROG_FORMULA])] });
      }
      applyProgs(await read("Programados!A1:L200"));
      toast(p ? "Programado actualizado" : "Programado agregado");
    }catch(e){ writeFailed(e); }
    finally{ setBusy(-1); render(); refreshSheet(); chargeDue(); }
  });
}
function deleteProg(p){
  if (S.mode!=="live"){ toast(S.mode==="example" ? "Vista de ejemplo: esto no se guarda en tu hoja." : "Sin conexión con tu hoja. Toca Reintentar arriba."); return; }
  setBusy(1);
  enqueue(async()=>{
    try{
      const row = await progRowNum(p.id);
      if (row) await call("update_spreadsheet", { spreadsheetId:SHEET_ID, requests:[{ deleteDimension:{ range:{ sheetId:PROG_GID, dimension:"ROWS", startIndex:row-1, endIndex:row } } }] });
      applyProgs(await read("Programados!A1:L200"));
      toast("Programado borrado. Los cobros que ya se hicieron se quedan.");
    }catch(e){ writeFailed(e); }
    finally{ setBusy(-1); render(); refreshSheet(); }
  });
}
/* Un cobro programado omitido se queda en la hoja con monto 0 para que no se vuelva a registrar */
function omitMov(m){
  if (S.mode!=="live"){ toast(S.mode==="example" ? "Vista de ejemplo: esto no se guarda en tu hoja." : "Sin conexión con tu hoja. Toca Reintentar arriba."); return; }
  S.movs = S.movs.filter(x=>x!==m); render();
  setBusy(1);
  enqueue(async()=>{
    try{
      const vals = await read("Movimientos!A:I");
      let row = 0; vals.forEach((r,i)=>{ if (i && r && String(r[8]||"").trim()===m.id) row = i+1; });
      if (row) await call("update_values", { spreadsheetId:SHEET_ID, range:"Movimientos!F"+row+":G"+row, values:[[0, "'Omitido"]] });
      applyMovs(await read("Movimientos!A:I"));
      toast("Cobro omitido");
    }catch(e){ writeFailed(e); }
    finally{ setBusy(-1); render(); refreshSheet(); }
  });
}

/* Regla: ver, editar, agregar */
function buildRule(sh, idx){
  const r = idx!=null ? S.rules[idx] : null;
  const st = { cat: r ? r.cat : null, cuenta: r ? r.cuenta : null };
  const cats = S.cats.filter(c=>c.tipo!=="Interno").map(c=>c.nombre);
  sh.innerHTML = head("Regla de categoría", r ? "“"+r.pat+"”" : "Nueva regla")
    + '<div class="sh-body">'
    + '<div class="form"><div class="field full"><label for="rPat">Si el concepto contiene</label><input id="rPat" autocomplete="off" placeholder="Ej. oxxo, uber, heb" value="'+esc(r?r.pat:'')+'"'+(r?'':' data-autofocus')+'></div></div>'
    + '<div class="grp"><div class="grp-h">Ponle la categoría</div><div class="chips" id="rCats"></div></div>'
    + '<div class="grp"><div class="grp-h">Y la cuenta (opcional)</div><div class="chips" id="rAccs"></div></div>'
    + '<p class="hint">No importan mayúsculas ni acentos. Si varias reglas coinciden, gana la más larga (“oxxo gas” le gana a “oxxo”).</p>'
    + '<div class="sh-actions">'+(r?'<button class="btn danger" data-act="rdel" id="rDelBtn">Borrar</button>':'<button class="btn" data-act="close">Cancelar</button>')+'<button class="btn primary" data-act="rsave">Guardar</button></div>'
    + '</div>';
  function draw(){
    $("rCats").innerHTML = chipsHtml(cats, st.cat, "data-rcat");
    $("rAccs").innerHTML = chipsHtml(C.cuentas.map(c=>c.nombre), st.cuenta, "data-racc");
  }
  draw();
  let armed = false;
  sheetState = {
    click(t){
      if (t.dataset.rcat!=null){ st.cat = st.cat===t.dataset.rcat ? null : t.dataset.rcat; draw(); return true; }
      if (t.dataset.racc!=null){ st.cuenta = st.cuenta===t.dataset.racc ? null : t.dataset.racc; draw(); return true; }
      return false;
    },
    rsave(){
      const pat = $("rPat").value.trim();
      if (!pat){ toast("Escribe qué texto buscar en el concepto"); $("rPat").focus(); return; }
      if (!st.cat){ toast("Elige una categoría"); return; }
      const dup = S.rules.findIndex((x,i)=> i!==idx && strip(x.pat)===strip(pat));
      const list = S.rules.filter((x,i)=> i!==dup);
      const nr = { pat, cat:st.cat, cuenta:st.cuenta||"" };
      const at = r ? list.indexOf(r) : -1;
      if (at>=0) list[at] = nr; else list.push(nr);
      closeSheet(); saveRules(list, "Regla guardada");
    },
    rdel(){ const b=$("rDelBtn"); if (!armed){ armed=true; b.classList.add("confirm"); b.textContent="Toca otra vez para borrar"; return; } closeSheet(); saveRules(S.rules.filter(x=>x!==r), "Regla borrada"); }
  };
}

/* Presupuestos: editar topes */
function buildBud(sh){
  const cats = S.cats.filter(c=>c.tipo==="Egreso");
  const st = { acum: S.cfg.presAcum };
  sh.innerHTML = head("Tope al mes por categoría", "Presupuestos")
    + '<div class="sh-body">'
    + '<div class="txs">' + cats.map((c,i)=>'<label class="bedit" for="bud'+i+'"><span>'+esc(c.nombre)+'</span><input id="bud'+i+'" inputmode="decimal" placeholder="Sin tope" autocomplete="off" value="'+(c.pres ? Math.round(c.pres*100)/100 : '')+'"'+(c.nombre===sheetArg?' data-autofocus':'')+'></label>').join("") + '</div>'
    + '<div class="grp"><div class="grp-h">Lo que sobra al final del mes</div><div class="seg" id="bAcum" style="grid-template-columns:1fr 1fr" role="group" aria-label="Lo que sobra"><button data-bacum="1">Pasa al siguiente</button><button data-bacum="0">Se pierde</button></div></div>'
    + '<p class="hint">Deja vacío lo que no quieras limitar. Si eliges que pase al siguiente, lo que te sobre se suma al tope del mes que sigue, y si te pasas, se resta. Esto es aparte de tu límite diario.</p>'
    + '<div class="sh-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="bsave">Guardar</button></div>'
    + '</div>';

  draw();
  sheetState = {
    click(t){ if (t.dataset.bacum){ st.acum = t.dataset.bacum==="1"; draw(); return true; } return false; },
    bsave(){
      const vals = {};
      for (let i=0;i<cats.length;i++){
        const raw = $("bud"+i).value.replace(/[,$\s]/g,"");
        if (!raw){ vals[cats[i].nombre] = null; continue; }
        const v = num(raw);

        vals[cats[i].nombre] = Math.round(v*100)/100;
      }
      closeSheet(); saveBudgets(vals, st.acum);

  };

/* Agregar movimiento */
function buildAdd(sh, date){
  const st = { tipo:"gasto", cat:null, cuenta:null, destino:null, catManual:false, accManual:false, remember:false, auto:null };
  const debit = () => C.cuentas.filter(c=>!c.credit).map(c=>c.nombre);
  const credit = () => C.cuentas.filter(c=>c.credit).map(c=>c.nombre);
  const allAcc = () => C.cuentas.map(c=>c.nombre);
  const defAcc = list => list.find(n=>strip(n)==="debito") || list[0] || null;
  const cats = () => S.cats.filter(c=> st.tipo==="gasto" ? c.tipo==="Egreso" : st.tipo==="ingreso" ? c.tipo==="Ingreso" : false).map(c=>c.nombre);
  const d0 = date || C.today;
  sh.innerHTML = head(longDate(d0), "Nuevo movimiento")
    + '<div class="sh-body">'
    + '<div class="seg" id="tipoSeg" role="group" aria-label="Tipo de movimiento"><button data-tipo="gasto">Gasto</button><button data-tipo="ingreso">Ingreso</button><button data-tipo="pago">Pago tarjeta</button></div>'
    + '<label class="amount" for="fMonto"><span class="sg" id="fSign">'+MINUS+'</span><input id="fMonto" inputmode="decimal" placeholder="0.00" autocomplete="off" data-autofocus aria-label="Monto"></label>'
    + '<div class="form"><div class="field full"><label for="fConcepto">Concepto</label><input id="fConcepto" placeholder="Ej. HEB, gasolina, renta 2206" autocomplete="off"></div></div>'
    + '<p class="rulehint" id="ruleHint" hidden></p>'
    + '<div class="grp" id="catGrp"><div class="grp-h">Categoría</div><div class="chips" id="catChips"></div><p class="budhint" id="budHint" hidden></p><div class="chips"><button class="chip" id="remChip" data-rem="1" aria-pressed="false" hidden></button></div></div>'
    + '<div class="grp"><div class="grp-h" id="accLbl">Cuenta</div><div class="chips" id="accChips"></div></div>'
    + '<div class="grp" id="dstGrp" hidden><div class="grp-h">A la tarjeta</div><div class="chips" id="dstChips"></div></div>'
    + '<div class="form"><div class="field"><label for="fFecha">Fecha</label><input id="fFecha" type="date" value="'+d0+'"></div><div class="field"><label for="fHora">Hora</label><input id="fHora" type="time" value="'+(d0===C.today?nowHM():"12:00")+'"></div>'
    + '<div class="field full"><label for="fNotas">Notas (opcional)</label><input id="fNotas" autocomplete="off"></div></div>'
    + '<div class="sh-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="save" id="saveBtn">Guardar gasto</button></div>'
    + '</div>';
  function chips(id, list, sel, attr){
    $(id).innerHTML = list.length ? list.map(n=>'<button class="chip" '+attr+'="'+esc(n)+'" aria-pressed="'+(n===sel)+'">'+esc(n)+(isCredit(n) && strip(n)!=="credito"?'<span class="tag">crédito</span>':'')+'</button>').join("") : '<span class="hint">Sin opciones todavía.</span>';
  }
  function draw(){
    document.querySelectorAll("#tipoSeg button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.tipo===st.tipo)));
    $("fSign").textContent = st.tipo==="ingreso" ? "+" : MINUS;
    $("fSign").className = "sg " + (st.tipo==="ingreso" ? "pos" : st.tipo==="gasto" ? "neg" : "");
    $("catGrp").hidden = st.tipo==="pago";
    $("dstGrp").hidden = st.tipo!=="pago";
    $("accLbl").textContent = st.tipo==="pago" ? "Pagas desde" : st.tipo==="ingreso" ? "Entra a" : "Pagaste con";
    const accs = st.tipo==="gasto" ? allAcc() : debit();
    if (!accs.includes(st.cuenta)) st.cuenta = defAcc(accs);
    if (!cats().includes(st.cat)) st.cat = null;
    if (!credit().includes(st.destino)) st.destino = credit()[0] || null;
    chips("catChips", cats(), st.cat, "data-cat");
    chips("accChips", accs, st.cuenta, "data-acc");
    chips("dstChips", credit(), st.destino, "data-dst");
    $("saveBtn").textContent = st.tipo==="gasto" ? "Guardar gasto" : st.tipo==="ingreso" ? "Guardar ingreso" : "Guardar pago";
    /* De dónde salió la categoría */
    const rh = $("ruleHint");
    if (st.auto && st.tipo!=="pago"){
      rh.hidden = false;
      rh.innerHTML = (st.auto.rule ? 'Regla “'+esc(st.auto.rule.pat)+'” → ' : 'Como la última vez → ')+'<b>'+esc([st.auto.cat, st.auto.cuenta].filter(Boolean).join(" · "))+'</b>';
    } else rh.hidden = true;
    /* Ofrecer guardar una regla */
    const conc = $("fConcepto").value.trim(), rc = $("remChip");
    const ruled = st.auto && st.auto.rule && st.auto.rule.cat===st.cat;
    rc.hidden = !(st.tipo!=="pago" && conc && st.cat && !ruled && strip(conc)!==strip(st.cat));
    if (rc.hidden) st.remember = false;
    rc.setAttribute("aria-pressed", String(st.remember));
    rc.textContent = (st.remember ? "✓ " : "")+"Siempre que diga “"+conc+"”, ponle "+(st.cat||"");
    /* Cómo va el presupuesto de esa categoría */
    const bh = $("budHint");
    const fecha = normDate($("fFecha").value) || C.today;
    const b = st.tipo==="gasto" && st.cat ? budgetFor(monthKey(fecha)).list.find(x=>x.cat===st.cat) : null;
    if (b){
      const amt = Math.max(0, num($("fMonto").value.replace(/,/g,"")) || 0), left = b.avail - b.spent - amt;
      bh.hidden = false;
      bh.innerHTML = esc(st.cat)+(amt>0?' con este gasto: ':': ')+(left>=-0.004 ? 'te quedan <b class="pos">'+money(left,{dec:false})+'</b>' : 'te pasas por <b class="neg">'+money(-left,{dec:false})+'</b>')+' de '+money(b.avail,{dec:false})+' en '+MONTHS[+fecha.slice(5,7)-1];
    } else bh.hidden = true;
  }
  function autoFill(){
    const c = $("fConcepto").value, r = matchRule(c), src = r || lastLike(c);
    st.auto = src && src.cat ? { rule:r, cat:src.cat, cuenta:src.cuenta||"" } : null;
    if (st.auto && st.tipo!=="pago"){
      if (!st.catManual){
        const t = catTipo(st.auto.cat);
        if (t==="Ingreso") st.tipo = "ingreso"; else if (t==="Egreso") st.tipo = "gasto";
        st.cat = st.auto.cat;
      }
      if (!st.accManual && st.auto.cuenta) st.cuenta = st.auto.cuenta;
    }
    draw();
  }
  draw();
  $("fConcepto").addEventListener("input", autoFill);
  $("fMonto").addEventListener("input", draw);
  $("fFecha").addEventListener("change", draw);
  sheetState = {
    click(t){
      if (t.dataset.tipo){ st.tipo=t.dataset.tipo; draw(); return true; }
      if (t.dataset.rem){ st.remember = !st.remember; draw(); return true; }
      if (t.dataset.cat!=null){ st.catManual = true; st.cat = st.cat===t.dataset.cat ? null : t.dataset.cat; draw(); return true; }
      if (t.dataset.acc!=null){ st.accManual = true; st.cuenta=t.dataset.acc; draw(); return true; }
      if (t.dataset.dst!=null){ st.destino=t.dataset.dst; draw(); return true; }
      return false;
    },
    save(){
      const amt = Math.round(num($("fMonto").value.replace(/,/g,""))*100)/100;
      if (!(amt>0)){ toast("Escribe un monto mayor a cero"); $("fMonto").focus(); return; }
      const fecha = normDate($("fFecha").value) || C.today, hora = normTime($("fHora").value);
      const concepto = $("fConcepto").value.trim(), notas = $("fNotas").value.trim();
      if (st.tipo==="pago"){
        if (!st.cuenta || !st.destino){ toast("Elige de qué cuenta pagas y a qué tarjeta"); return; }
        const base = newId("p");
        addMovs([
          { id:base+"a", fecha, hora, concepto: concepto || ("Pago a "+st.destino), cat:"Pago de tarjeta", cuenta:st.cuenta, monto:-amt, notas, origen:"App" },
          { id:base+"b", fecha, hora, concepto: concepto || ("Pago desde "+st.cuenta), cat:"Pago de tarjeta", cuenta:st.destino, monto:amt, notas, origen:"App" }
        ]);
      } else {
        if (!st.cat){ toast("Elige una categoría"); return; }
        addMovs([{ id:newId("m"), fecha, hora, concepto: concepto || st.cat, cat:st.cat, cuenta:st.cuenta||"", monto: st.tipo==="gasto" ? -amt : amt, notas, origen:"App" }]);
        if (st.remember && concepto){
          const pat = concepto.toLowerCase();
          const list = S.rules.filter(x=>strip(x.pat)!==strip(pat)).concat([{ pat, cat:st.cat, cuenta:st.cuenta||"" }]);
          saveRules(list, "Regla guardada: “"+pat+"” → "+st.cat);
        }
      }
      closeSheet();
    }
  };
}
