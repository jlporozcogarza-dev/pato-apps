<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer">
<title>JLP</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="JLP">
<meta name="theme-color" content="#07080A">
<link rel="apple-touch-icon" href="tracker/icon-180.png"><link rel="icon" href="tracker/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Solo oscuro. Vidrio: fondo translúcido + blur + borde de luz arriba; los brillos de color de atrás le dan qué difuminar. */
:root{color-scheme:dark;--bg:#07080A;--fg:#F3F5EE;--muted:#9EA39A;--lime:#C6F24E;--lime2:#8FD13A;
  --glass:rgba(255,255,255,.065);--glass-hi:rgba(255,255,255,.10);--edge:rgba(255,255,255,.14);--edge-top:rgba(255,255,255,.28);
  --blur:blur(28px) saturate(170%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--fg);font:16px/1.35 Outfit,system-ui,sans-serif;padding:max(18px,env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom));
  background:
    radial-gradient(42% 30% at 88% 6%,rgba(198,242,78,.30),transparent 70%),
    radial-gradient(50% 34% at 4% 44%,rgba(38,196,170,.20),transparent 70%),
    radial-gradient(46% 30% at 92% 86%,rgba(255,123,84,.16),transparent 70%),
    var(--bg);background-attachment:fixed}
main{max-width:460px;margin:0 auto}
a{color:inherit;text-decoration:none}
.glass{background:linear-gradient(180deg,var(--glass-hi),var(--glass));-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge-top),inset 0 -1px 0 rgba(255,255,255,.04),0 18px 40px -18px rgba(0,0,0,.7)}
header{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.logo{width:46px;height:46px;border-radius:15px;color:var(--lime);display:grid;place-items:center;font-weight:600;font-size:15px;letter-spacing:.03em}
header p{margin:0;font-weight:500;font-size:18px}
header small{color:var(--muted);font-size:13px}
header small::first-letter{text-transform:uppercase}
.hero{position:relative;display:block;overflow:hidden;border-radius:28px;padding:18px 18px 16px;margin-bottom:12px;color:#14180B;
  background:radial-gradient(120% 80% at 85% -10%,rgba(246,255,200,.95),transparent 55%),linear-gradient(160deg,rgba(198,242,78,.92),rgba(143,209,58,.82));
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid rgba(240,255,190,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 24px 60px -24px rgba(160,230,60,.55)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.35) 0%,transparent 28%,transparent 70%,rgba(255,255,255,.12) 100%)}
.row{display:flex;justify-content:space-between;align-items:center}
.hero .t{font-size:17px;font-weight:500}
.hero .p{font-size:13px;opacity:.7}
.big{font-size:60px;font-weight:300;letter-spacing:-.035em;line-height:1;margin:14px 0 4px;display:flex;align-items:baseline;gap:10px}
.big small{font-size:13px;font-weight:400;opacity:.65;letter-spacing:0}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;margin-top:14px}
.bars i{display:block;border-radius:14px;min-height:10px;transition:height .6s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.30));box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.bars i.hoy{background:linear-gradient(180deg,#fff,rgba(255,255,255,.75))}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px;font-size:12px;text-align:center;opacity:.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border-radius:24px;padding:16px;min-height:136px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s ease,background .2s ease}
.tile .n{font-size:clamp(30px,9vw,40px);padding-right:20px;white-space:nowrap;font-weight:300;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:14px;color:var(--muted);line-height:1.25}
.arrow{position:absolute;top:14px;right:14px;width:18px;height:18px;color:var(--muted);transition:transform .2s ease,color .2s ease}
.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
.wide .ic{width:42px;height:42px;border-radius:13px;background:rgba(198,242,78,.14);border:1px solid rgba(198,242,78,.25);display:grid;place-items:center;font-size:20px}
.wide .arrow{position:static;margin-left:auto}
.hero,.tile{-webkit-user-select:none;user-select:none}
.hero:active,.tile:active{transform:scale(.98)}
@media (hover:hover){.tile:hover{transform:translateY(-2px);--glass:rgba(255,255,255,.09)}.tile:hover .arrow{color:var(--lime);transform:translate(2px,-2px)}.hero:hover{transform:translateY(-2px)}}
.hero{transition:transform .2s ease}
nav{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:24px;
  background:linear-gradient(180deg,rgba(40,42,46,.55),rgba(20,21,24,.55))}
nav a{width:54px;height:48px;border-radius:18px;display:grid;place-items:center;color:#C9CCC4;transition:background .2s,color .2s}
nav a:hover{color:#fff}
nav a.on{background:linear-gradient(180deg,#D8F86E,var(--lime));color:#14180B;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 18px -6px rgba(198,242,78,.6)}
nav svg{width:22px;height:22px}
a:focus-visible,button:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.conectar{margin-top:14px;width:100%;padding:14px;border-radius:18px;color:var(--fg);font:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main>
<header>
  <div class="logo glass" aria-hidden="true">JLP</div>
  <div><p>Hola, Pato</p><small id="fecha">Hoy</small></div>
</header>

<a class="hero" href="tracker/" aria-label="Abrir tracker">
  <div class="row"><span class="t">Recovery</span><span class="p">Últimos 7 días</span></div>
  <div class="big"><span id="rec">–</span><small id="recNota"></small></div>
  <div class="bars" id="bars"></div>
  <div class="dias" id="dias"></div>
</a>

<section class="grid">
  <a class="tile glass" href="finanzas/"><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg><span class="n" id="gasto">–</span><span class="l">gastado<br>hoy</span></a>
  <a class="tile glass" href="tracker/"><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg><span class="n" id="sueno">–</span><span class="l">horas de<br>sueño</span></a>
  <a class="tile glass" href="tracker/"><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg><span class="n" id="hrv">–</span><span class="l">HRV<br>(ms)</span></a>
  <a class="tile glass" href="finanzas/"><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg><span class="n" id="mes">–</span><span class="l">gastado<br>este mes</span></a>
</section>
<button class="conectar glass" id="conectar" hidden>Conectar mis datos</button>
</main>

<nav class="glass" aria-label="Apps">
  <a class="on" href="./" aria-label="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg></a>
  <a href="tracker/" aria-label="Tracker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg></a>
  <a href="finanzas/" aria-label="Finanzas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg></a>
</nav>

<script>
/* Misma configuración que tracker y finanzas (mismo sitio, misma llave "pato-puente"). */
const LS = "pato-puente", APIS = ["https://api.jlpog.app/"];
const TRACKER = "1L90iaeKk-U3Y7siZ4h7pFOfguUrEbK4IVvqk1YEuFFM", FIN = "1Wj1YoOCuqjQB-4rtikdTKAhFRCSRloNsWJeLMez4vic";
const $ = id => document.getElementById(id);
const hoy = new Date().toLocaleDateString("sv-SE");
$("fecha").textContent = new Date().toLocaleDateString("es-MX", { weekday:"long", day:"numeric", month:"long" });

function cfg(){
  const p = new URLSearchParams(location.search);
  if (p.get("u") && p.get("k")) { const c = { u:p.get("u"), k:p.get("k") }; try{ localStorage.setItem(LS, JSON.stringify(c)); }catch(e){} history.replaceState(null, "", location.pathname); return c; }
  try{ return JSON.parse(localStorage.getItem(LS) || "null"); }catch(e){ return null; }
}
async function leer(c, sheet, range){
  let r; for (const api of APIS){ try{ r = await fetch(api, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify({ k:c.k, tool:"get_values", input:{ spreadsheetId:sheet, range } }) }); break; }catch(e){ if (api === APIS[APIS.length-1]) throw e; } }
  const j = await r.json(); if (j.error) throw new Error(j.error); return j.result.values || [];
}
const num = v => typeof v === "number" ? v : parseFloat(String(v||"").replace(/[^0-9.\-]/g, ""));
const fecha = v => String(v||"").replace(/^'/, "").slice(0, 10);
const pesos = n => "$" + Math.round(n).toLocaleString("es-MX");

function barras(serie){ // serie: [{d:"2026-11-10", v:72}, ...] últimos 7 días
  const D = ["Do","Lu","Ma","Mi","Ju","Vi","Sá"];
  $("bars").innerHTML = serie.map(x => `<i class="${x.d===hoy?"hoy":""}" style="height:${isFinite(x.v)?Math.max(8,x.v):8}%" title="${x.d}: ${isFinite(x.v)?x.v+"%":"sin dato"}"></i>`).join("");
  $("dias").innerHTML = serie.map(x => `<span>${D[new Date(x.d+"T12:00").getDay()]}</span>`).join("");
}
function ultimos7(){ return [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return d.toLocaleDateString("sv-SE"); }); }
barras(ultimos7().map(d => ({ d, v:NaN })));

async function cargar(c){
  leer(c, TRACKER, "Whoop!A:H").then(rows => {
    const porDia = {}; rows.slice(1).forEach(r => { if (r[0]) porDia[fecha(r[0])] = r; });
    barras(ultimos7().map(d => ({ d, v:num((porDia[d]||[])[6]) })));
    const u = Object.keys(porDia).sort().map(k => porDia[k]).filter(r => isFinite(num(r[6]))).pop();
    if (!u) return;
    $("rec").textContent = num(u[6]) + "%";
    $("recNota").textContent = fecha(u[0]) === hoy ? "hoy" : "del " + new Date(fecha(u[0])+"T12:00").toLocaleDateString("es-MX",{ day:"numeric", month:"short" });
    const h = num(u[3]); if (isFinite(h)) $("sueno").textContent = h.toFixed(1);
    const hrv = num(u[7]); if (isFinite(hrv)) $("hrv").textContent = Math.round(hrv);
  }).catch(() => {});
  leer(c, FIN, "Movimientos!A:F").then(rows => {
    const gastos = rows.slice(1).filter(r => !/pago de tarjeta|transferencia/i.test(r[3] || "")).map(r => ({ d:fecha(r[0]), m:num(r[5]) })).filter(x => isFinite(x.m) && x.m < 0);
    $("gasto").textContent = pesos(-gastos.filter(x => x.d === hoy).reduce((a, x) => a + x.m, 0));
    $("mes").textContent = pesos(-gastos.filter(x => x.d.slice(0, 7) === hoy.slice(0, 7)).reduce((a, x) => a + x.m, 0));
  }).catch(() => {});
}

const c = cfg();
if (c) cargar(c);
else {
  $("conectar").hidden = false;
  $("conectar").onclick = () => {
    const s = prompt("Pega el link de configuración que te mandó Claude");
    try{ const u = new URL(s.trim()).searchParams; if (u.get("u") && u.get("k")) { localStorage.setItem(LS, JSON.stringify({ u:u.get("u"), k:u.get("k") })); location.reload(); } }catch(e){}
  };
}
</script>
</body></html>
