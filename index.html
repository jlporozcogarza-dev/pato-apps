<!doctype html><html lang="es" data-tab="inicio"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer">
<title>JLP</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="JLP">
<meta name="theme-color" content="#1C1C1C" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="jlp-180.png"><link rel="icon" href="jlp-192.png">
<link rel="preconnect" href="https://api.jlpog.app" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
<style>
/* JLP: una sola app con pestañas. Colores tradicionales japoneses (nippon iro) con la regla 60-30-10:
   60 = fondo, 30 = tarjetas de vidrio, 10 = acento. Tracker y Finanzas usan las mismas paletas (build.py, PALETAS). */
@property --c60{syntax:"<color>";inherits:true;initial-value:#1C1C1C}
@property --c30{syntax:"<color>";inherits:true;initial-value:#535953}
@property --c10{syntax:"<color>";inherits:true;initial-value:#BEC23F}
:root{color-scheme:dark;--fg:#F4F1EA;--muted:#ABA69D;--blur:blur(28px) saturate(160%);
  transition:--c60 .6s ease,--c30 .6s ease,--c10 .6s ease}
/* Los colores de cada pestaña los pone el script (PALETAS) según lo que elijas en Colores. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Tipografía: Instrument Serif para números y títulos, Geist para el texto, Shippori Mincho para los kanji */
:root{--serif:"Instrument Serif",ui-serif,Georgia,serif;--sans:Geist,system-ui,-apple-system,sans-serif;--kanji:"Shippori Mincho",serif}
html,body{margin:0;height:100%;overflow:hidden;background:var(--c60);color:var(--fg);font:16px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
/* iOS deja una franja abajo de la app (pantalla de inicio) donde no deja dibujar; solo se ve el fondo del html.
   Se pinta del color de la barra de pestañas para que barra y franja se vean como una sola, pegada al borde. */
html{background:color-mix(in srgb,var(--c30) 24%,var(--c60))}
.fondo{position:fixed;inset:0;bottom:0;z-index:0;pointer-events:none;
  background:radial-gradient(48% 32% at 90% 4%,color-mix(in srgb,var(--c10) 26%,transparent),transparent 70%),
             radial-gradient(56% 36% at 0% 46%,color-mix(in srgb,var(--c30) 34%,transparent),transparent 70%),
             radial-gradient(50% 30% at 96% 92%,color-mix(in srgb,var(--c30) 22%,transparent),transparent 70%),var(--c60)}
.vista{position:fixed;inset:0;z-index:1;border:0;width:100%;height:100%;background:transparent;display:none}
.vista.on{display:block}
/* las apps ya respetan la muesca del iPhone por su cuenta: el iframe va a pantalla completa */
#v-inicio,#v-condotec,#v-pendientes{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(14px,env(safe-area-inset-top)) 16px calc(76px + env(safe-area-inset-bottom))}
/* el Inicio cabe en una pantalla: la gráfica toma lo que sobre (si un teléfono es muy chico, se puede deslizar) */
#v-inicio main{display:flex;flex-direction:column;min-height:100%;gap:10px}
#v-inicio main>*{flex:none}
main{max-width:460px;margin:0 auto}
button{font:inherit;color:inherit}
.glass{background:linear-gradient(180deg,color-mix(in srgb,var(--c30) 30%,transparent),color-mix(in srgb,var(--c30) 16%,transparent));
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid color-mix(in srgb,var(--c30) 45%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 40px -20px rgba(0,0,0,.75)}
header{display:flex;align-items:center;gap:12px;margin:4px 0 2px}
.logo{width:62px;height:62px;border-radius:20px;color:var(--c10);display:grid;place-items:center;font:400 24px/1 var(--serif);letter-spacing:.01em}
header p{margin:0;font:400 34px/1 var(--serif);letter-spacing:-.01em}
header p em{color:var(--c10)}
header small{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}
.quien{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;color:inherit;transition:transform .2s}
.quien:active{transform:scale(.97)}
.logo{position:relative}
.aviso{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--c10);color:var(--c60);
  font:600 11px/19px var(--sans);font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--c60)}
/* hoja de Pendientes y Depas (como en Fede) */
.accesos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.acceso{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);color:inherit;text-decoration:none;min-height:56px}
.acceso b{display:block;font-weight:500;font-size:14px}.acceso small{color:var(--muted);font-size:12px}
.acceso .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c10) 18%,transparent);color:var(--c10)}
.acceso .ic svg{width:17px;height:17px}
.cifras{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px}
.cifra{padding:10px 8px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);text-align:center}
.cifra b{display:block;font:400 28px/1 var(--serif)}.cifra small{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.renglones{display:grid;gap:8px}
.renglon{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.renglon .arriba{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.renglon b{font-weight:500;font-size:14px;line-height:1.3}
.renglon p{margin:4px 0 0;color:var(--muted);font-size:12.5px;line-height:1.35}
.marca{flex:none;font-size:11px;padding:3px 8px;border-radius:9px;white-space:nowrap;background:rgba(255,255,255,.08);color:var(--muted)}
.t-rojo{color:#FF8A80;background:rgba(255,90,80,.16)}.t-ambar{color:#F6C35B;background:rgba(246,195,91,.15)}
.t-verde{color:#86E0A6;background:rgba(80,200,120,.15)}.t-azul{color:#8EC5FF;background:rgba(80,150,255,.16)}.t-gris{color:var(--muted)}
.cifra b.t-rojo,.cifra b.t-ambar,.cifra b.t-verde,.cifra b.t-azul{background:none}
.nota{color:var(--muted);font-size:12px;margin:8px 2px 0}
.seccion{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 12px}
.seccion h2{margin:0;font:italic 400 26px/1 var(--serif);letter-spacing:-.01em}
.seccion span{color:var(--muted);font-size:12px}
header small::first-letter{text-transform:uppercase}
/* Inicio: proporciones de las referencias (tarjetas grandes, números enormes, barras con su valor, progresos), en vidrio */
.row{display:flex;justify-content:space-between;align-items:center}
.cap{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;line-height:.9;white-space:nowrap}
.num sup{font-size:.42em;vertical-align:top;position:relative;top:.1em;margin-left:2px;letter-spacing:0}
button.card{width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit;-webkit-user-select:none;user-select:none;transition:transform .2s ease}
button.card:active{transform:scale(.98)}
@media (hover:hover){button.card:hover{transform:translateY(-2px)}}
/* WHOOP: tres anillos con los colores de la paleta (60-30-10) */
.whoop{border-radius:30px;padding:14px 10px 12px;
  --a-sueno:color-mix(in srgb,var(--c30) 50%,#fff 50%);--a-rec:var(--c10);--a-esf:color-mix(in srgb,var(--c10) 50%,#fff 50%)}
.marca-whoop{text-align:center;font:500 14px/1 var(--sans);letter-spacing:.42em;padding-left:.42em;margin:0 0 10px}
.anillos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.anillo{display:grid;justify-items:center;gap:10px;background:none;border:0;padding:0;color:inherit;cursor:pointer;font:inherit;transition:transform .2s}
.anillo:active{transform:scale(.96)}
.aro{position:relative;width:100%;max-width:min(96px,25vw);aspect-ratio:1;display:grid;place-items:center}
.aro svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.aro .pista{fill:none;stroke:rgba(255,255,255,.09);stroke-width:9}
.aro .arco{fill:none;stroke:var(--col);stroke-width:9;stroke-linecap:round;stroke-dasharray:0 100;
  transition:stroke-dasharray 1.3s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--col) 55%,transparent))}
.aro .num{position:relative;font-size:clamp(28px,8.5vw,34px)}
.anillo .lbl{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
.anillo .lbl i{font-style:normal;color:var(--muted);margin-left:3px}
.whoop-pie{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--c30) 35%,transparent);font-size:12.5px;color:var(--muted)}
.whoop-pie b{color:var(--fg);font-weight:500}
/* pasos, calorías, gastado hoy y mes */
.cuatro{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{position:relative;overflow:hidden;border-radius:24px;padding:13px 14px;min-height:84px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.stat[hidden]{display:none}
/* con 3 tarjetas (p. ej. sin pasos) van en una fila para que la gráfica tenga más alto */
.cuatro.tres{grid-template-columns:repeat(3,1fr)}
.cuatro.tres .stat{padding:12px;min-height:78px;border-radius:22px}
.cuatro.tres .num{font-size:clamp(24px,7.5vw,32px)}
.cuatro.tres small{font-size:11.5px;line-height:1.2}
.stat .relleno{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0) * 1%);transition:width .9s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c10) 30%,transparent),color-mix(in srgb,var(--c10) 10%,transparent))}
.stat .num{position:relative;font-size:clamp(30px,9vw,38px)}
.stat small{position:relative;color:var(--muted);font-size:12.5px}
.grafica{display:flex!important;flex-direction:column;border-radius:28px;padding:14px 14px 10px}
#v-inicio .grafica{flex:1 1 0;min-height:130px}
.grafica .t{font-size:16px;font-weight:500}
.barras{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:end;flex:1;min-height:60px;margin-top:10px}
.col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:6px}
.col .chip{align-self:center;min-width:32px;padding:5px 6px;border-radius:10px;text-align:center;font:500 12px/1 var(--sans);background:color-mix(in srgb,var(--c30) 45%,rgba(0,0,0,.35))}
.col i{display:block;border-radius:12px;min-height:8px;transform-origin:bottom;transition:height .6s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c30) 70%,#fff 8%),color-mix(in srgb,var(--c30) 35%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.col.max i{background:linear-gradient(180deg,var(--c10),color-mix(in srgb,var(--c10) 60%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 24px -10px var(--c10)}
.col.max .chip{background:var(--c10);color:var(--c60)}
.col.vacio .chip{visibility:hidden}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:8px;font-size:12px;text-align:center;color:var(--muted)}


/* pestaña Pendientes: calendario + agenda del día */
.calendario{border-radius:28px;padding:14px 12px 10px;margin-bottom:4px}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
.cal-top b{font:italic 400 26px/1 var(--serif)}
.cal-nav{width:42px;height:42px;border-radius:13px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--fg);font-size:22px;line-height:1;cursor:pointer}
.cal-sem,.cal-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-sem span{font-size:11px;color:var(--muted);padding:2px 0 6px}
.dia{height:46px;border:0;border-radius:13px;background:none;color:var(--fg);font:500 14px/1 var(--sans);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;transition:background .2s}
.dia.fuera{opacity:.28}
.dia.hoy{box-shadow:inset 0 0 0 1.5px var(--c10)}
.dia.sel{background:var(--c10);color:var(--c60)}
.puntos{display:flex;gap:2px;height:5px}
.puntos i{width:5px;height:5px;border-radius:50%;background:var(--col,var(--c10))}
.puntos i.pend{background:color-mix(in srgb,var(--c30) 60%,#fff)}.puntos i.venc{background:#FF7A6E}
.dia.sel .puntos i{box-shadow:0 0 0 1px var(--c60)}
.evento{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.evento .barra{width:4px;align-self:stretch;border-radius:2px;background:var(--col,var(--c10));flex:none}
.evento .hora{flex:none;width:56px;font:500 13px/1.3 var(--sans);color:var(--muted)}
.evento b{display:block;font-weight:500;font-size:14px;line-height:1.3}
.evento small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
/* página Condotec */
.titulo-pagina{margin:4px 0 16px}.titulo-pagina small{color:var(--muted);font-size:13px}
.titulo-pagina h1{margin:4px 0 0;font:400 52px/1 var(--serif);letter-spacing:-.01em}
/* barra de pestañas pegada abajo a todo lo ancho, como en una app normal */
nav{position:fixed;z-index:5;left:0;right:0;bottom:0;display:flex;padding:6px 12px max(4px,calc(4px + env(safe-area-inset-bottom) - var(--franja,0px)));
  background:color-mix(in srgb,var(--c30) 24%,var(--c60))!important;
  border-radius:0!important;border-width:1px 0 0!important;transition:opacity .2s,transform .3s cubic-bezier(.2,.8,.2,1)}
nav.oculta{opacity:0;pointer-events:none;transform:translateY(100%)}
nav button{position:relative;z-index:1;flex:1;height:54px;border:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;color:#D4D0C8;cursor:pointer;transition:color .35s;font:500 11px/1 var(--sans);letter-spacing:.01em}
nav button[aria-selected=true]{color:var(--c60)}
nav button[aria-selected=true] svg{animation:pop .5s cubic-bezier(.34,1.6,.5,1)}
/* la pastilla se desliza al botón activo */
.pastilla{position:absolute;top:6px;left:0;width:0;height:54px;border-radius:16px;
  transition:transform .55s cubic-bezier(.34,1.35,.5,1),width .4s ease;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c10) 80%,#fff),var(--c10));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 18px -6px var(--c10)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
/* la pantalla entra desde el lado de la pestaña y sus textos suben escalonados */
/* cambio de pestaña: la nueva entra y la anterior sale a la vez (solo opacidad y movimiento: lo más fluido en iPhone) */
@keyframes entrar{from{opacity:0;transform:translateX(calc(var(--dir,1) * 28px)) scale(.985)}to{opacity:1;transform:none}}
@keyframes salir{from{opacity:1;transform:none}to{opacity:0;transform:translateX(calc(var(--dir,1) * -28px)) scale(.985)}}
.vista.sale{display:block;z-index:0;pointer-events:none;animation:salir .38s cubic-bezier(.4,0,.2,1) both}
.vista.on{z-index:1}
@keyframes sube{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.vista.entra{animation:entrar .55s cubic-bezier(.22,1,.36,1) both;will-change:transform,opacity}
#v-inicio.entra :is(header,.whoop,.stat,.grafica){animation:sube .55s cubic-bezier(.2,.8,.2,1) both}
#v-inicio.entra .whoop{animation-delay:.05s}#v-inicio.entra .stat:nth-child(1){animation-delay:.1s}#v-inicio.entra .stat:nth-child(2){animation-delay:.14s}
#v-inicio.entra .stat:nth-child(3){animation-delay:.18s}#v-inicio.entra .stat:nth-child(4){animation-delay:.22s}
#v-inicio.entra .grafica{animation-delay:.26s}
/* Entrada al abrir la app (o al volver después de un rato): todo aparece por partes */
@keyframes fondoIn{from{opacity:0}to{opacity:1}}
@keyframes logoIn{from{opacity:0;transform:scale(.6) rotate(-8deg);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes subeBlur{from{opacity:0;transform:translateY(22px) scale(.98);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes crece{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes navIn{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:none}}
.intro-on .fondo{animation:fondoIn 1s ease both}
.intro-on nav{animation:navIn .7s cubic-bezier(.2,.9,.25,1.15) .95s both}
#v-inicio.intro .logo{animation:logoIn .7s cubic-bezier(.2,.9,.3,1.2) .1s both}
#v-inicio.intro .quien div{animation:subeBlur .7s cubic-bezier(.2,.8,.2,1) .2s both}
#v-inicio.intro .ajustes{animation:logoIn .6s ease .3s both}
#v-inicio.intro .whoop{animation:subeBlur .8s cubic-bezier(.2,.8,.2,1) .3s both}
#v-inicio.intro .marca-whoop{animation:subeBlur .7s ease .45s both}
#v-inicio.intro .anillo{animation:logoIn .7s cubic-bezier(.2,.9,.3,1.2) both}
#v-inicio.intro .anillo:nth-child(1){animation-delay:.5s}#v-inicio.intro .anillo:nth-child(2){animation-delay:.6s}#v-inicio.intro .anillo:nth-child(3){animation-delay:.7s}
#v-inicio.intro .stat{animation:subeBlur .7s cubic-bezier(.2,.8,.2,1) both}
#v-inicio.intro .stat:nth-child(1){animation-delay:0.93s}#v-inicio.intro .stat:nth-child(2){animation-delay:1.01s}#v-inicio.intro .stat:nth-child(3){animation-delay:1.09s}#v-inicio.intro .stat:nth-child(4){animation-delay:1.17s}
@keyframes llena{from{width:0}}
#v-inicio.intro .stat .relleno{animation:llena 1.1s cubic-bezier(.2,.8,.2,1) 1.1s both}
#v-inicio.intro .grafica{animation:subeBlur .8s cubic-bezier(.2,.8,.2,1) 1.2s both}
#v-inicio.intro .col i{animation:crece .7s cubic-bezier(.2,.9,.3,1.1) both}
#v-inicio.intro .col .chip{animation:subeBlur .5s ease both}
#v-inicio.intro .col:nth-child(1) i{animation-delay:1.35s}#v-inicio.intro .col:nth-child(1) .chip{animation-delay:1.55s}#v-inicio.intro .col:nth-child(2) i{animation-delay:1.40s}#v-inicio.intro .col:nth-child(2) .chip{animation-delay:1.60s}#v-inicio.intro .col:nth-child(3) i{animation-delay:1.45s}#v-inicio.intro .col:nth-child(3) .chip{animation-delay:1.65s}#v-inicio.intro .col:nth-child(4) i{animation-delay:1.50s}#v-inicio.intro .col:nth-child(4) .chip{animation-delay:1.70s}#v-inicio.intro .col:nth-child(5) i{animation-delay:1.55s}#v-inicio.intro .col:nth-child(5) .chip{animation-delay:1.75s}#v-inicio.intro .col:nth-child(6) i{animation-delay:1.60s}#v-inicio.intro .col:nth-child(6) .chip{animation-delay:1.80s}#v-inicio.intro .col:nth-child(7) i{animation-delay:1.65s}#v-inicio.intro .col:nth-child(7) .chip{animation-delay:1.85s}

@media (prefers-reduced-motion:reduce){#v-inicio.intro *,.intro-on .fondo,.intro-on nav{animation:none!important}}
/* un número que cambia hace un pequeño destello */
@keyframes nuevo{from{opacity:.2;filter:blur(6px);transform:translateY(6px)}to{opacity:1;filter:none;transform:none}}
.nuevo{animation:nuevo .45s ease both}
nav svg{width:23px;height:23px}
:focus-visible{outline:2px solid var(--c10);outline-offset:3px}
.conectar{width:100%;padding:16px;border-radius:18px;cursor:pointer;font-weight:500;color:var(--c60)!important;background:var(--c10)!important}
header .ajustes{margin-left:auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
header .ajustes svg{width:20px;height:20px}
/* hoja de Colores */
.velo{position:fixed;inset:0;bottom:0;z-index:8;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:fixed;z-index:9;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c30) 34%,transparent),color-mix(in srgb,var(--c60) 94%,transparent)),var(--c60);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:1px solid color-mix(in srgb,var(--c30) 50%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}

.hoja .asa{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 12px}
.hoja h2{font-size:24px;font-weight:500;margin:0 0 4px}

.hoja h3 span{color:var(--muted);font-weight:400;font-size:13px}
.carril{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.carril::-webkit-scrollbar{display:none}
.pal{flex:none;scroll-snap-align:start;width:92px;padding:8px;border-radius:18px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);cursor:pointer;text-align:left}
.pal .mu{height:56px;border-radius:12px;overflow:hidden;display:grid;grid-template-columns:6fr 3fr 1fr}
.pal b{display:block;font-size:13px;font-weight:500;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal small{display:block;font:500 11px/1.4 var(--kanji);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hoja>h2{font:400 34px/1 var(--serif)!important}
.pal[aria-pressed=true]{border-color:var(--c10);box-shadow:0 0 0 2px color-mix(in srgb,var(--c10) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.18);background:rgba(255,255,255,.08)}
.hoja .fila{display:flex;gap:10px;margin-top:22px}
.hoja .fila button{flex:1;min-height:48px;border-radius:16px;cursor:pointer;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06)}
.hoja .fila .listo{background:var(--c10);color:var(--c60);border-color:transparent;font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

<script>
/* Misma configuración que tracker y finanzas (mismo sitio, misma llave "pato-puente"). */
const LS = "pato-puente", API = "https://api.jlpog.app/";
const TRACKER = "1L90iaeKk-U3Y7siZ4h7pFOfguUrEbK4IVvqk1YEuFFM", FIN = "1Wj1YoOCuqjQB-4rtikdTKAhFRCSRloNsWJeLMez4vic";
const $ = id => document.getElementById(id);

/* ---------- paletas: colores tradicionales japoneses (nippon iro), regla 60-30-10 ----------
   c60 = fondo (versión oscura del color base), c30 = vidrio, c10 = acento. */
const PALETAS = [
  { id:"hiwa",       n:"Hiwa",       k:"墨 · 青鈍 · 鶸",       c60:"#1C1C1C", c30:"#535953", c10:"#BEC23F" },
  { id:"sangoshu",   n:"Sangoshu",   k:"鳶 · 紅樺 · 珊瑚朱",   c60:"#1E1512", c30:"#B54434", c10:"#F17C67" },
  { id:"byakuroku",  n:"Byakuroku",  k:"褐 · 藍鼠 · 白緑",     c60:"#08192D", c30:"#566C73", c10:"#A8D8B9" },
  { id:"wasurenagusa", n:"Wasurenagusa", k:"紺 · 群青 · 勿忘草", c60:"#0B1A2E", c30:"#51A8DD", c10:"#7DB9DE" },
  { id:"yamabuki",   n:"Yamabuki",   k:"消炭 · 利休鼠 · 山吹", c60:"#1A1A1A", c30:"#656765", c10:"#FFB11B" },
  { id:"kamenozoki", n:"Kamenozoki", k:"黒橡 · 青磁 · 瓶覗",   c60:"#0B1013", c30:"#69B0AC", c10:"#A5DEE4" },
  { id:"moegi",      n:"Moegi",      k:"深緑 · 千歳緑 · 萌黄", c60:"#0E1712", c30:"#36563C", c10:"#90B44B" },
  { id:"kuchiba",    n:"Kikuchiba",  k:"焦茶 · 弁柄 · 黄朽葉", c60:"#1A130E", c30:"#9A5034", c10:"#D9AB42" },
  { id:"nadeshiko",  n:"Nadeshiko",  k:"黒紅 · 蘇芳 · 撫子",   c60:"#1A0E10", c30:"#8E354A", c10:"#DC9FB4" },
  { id:"kariyasu",   n:"Kariyasu",   k:"藍 · 錆青磁 · 刈安",   c60:"#071A1E", c30:"#86A697", c10:"#E9CD4C" },
  { id:"shu",        n:"Shu",        k:"鉛 · 銀鼠 · 朱",       c60:"#121212", c30:"#91989F", c10:"#ED784A" },
  { id:"anzu",       n:"Anzu",       k:"柿渋 · 胡桃 · 杏",     c60:"#1C120E", c30:"#A35E47", c10:"#E9A368" },
  { id:"sora",       n:"Sora",       k:"鉄紺 · 縹 · 空",       c60:"#0B1420", c30:"#006284", c10:"#58B2DC" },
  { id:"nanohana",   n:"Nanohana",   k:"苔 · 海松 · 菜の花",   c60:"#14150C", c30:"#838A2D", c10:"#F7D94C" },
  { id:"arazome",    n:"Arazome",    k:"墨 · 胡桃 · 退紅",     c60:"#1B1717", c30:"#947A6D", c10:"#F596AA" },
];
const ORDEN = ["inicio", "tracker", "finanzas", "condotec", "pendientes"], NOMBRE = { inicio:"Inicio", tracker:"Tracker", finanzas:"Finanzas", condotec:"Condotec", pendientes:"Pendientes" };
const DEF = { inicio:"hiwa", tracker:"sangoshu", finanzas:"byakuroku", condotec:"kuchiba", pendientes:"sora" }, LSP = "jlp-paletas";
let elegidas = (() => { try{ return Object.assign({}, DEF, JSON.parse(localStorage.getItem(LSP) || "{}")); }catch(e){ return { ...DEF }; } })();
const pal = tab => PALETAS.find(p => p.id === elegidas[tab]) || PALETAS.find(p => p.id === DEF[tab]);
function pintar(){
  const p = pal(actual), r = document.documentElement.style;
  r.setProperty("--c60", p.c60); r.setProperty("--c30", p.c30); r.setProperty("--c10", p.c10);
  $("themeColor").content = p.c60;
  ORDEN.forEach(pintarApp);
}
function pintarApp(tab){ // las apps leen --j60/--j30/--j10 (tema de build.py)
  const f = vistas[tab]; if (!f || f.tagName !== "IFRAME") return;
  try{ const p = pal(tab), s = f.contentDocument.documentElement.style; s.setProperty("--j60", p.c60); s.setProperty("--j30", p.c30); s.setProperty("--j10", p.c10); }catch(e){}
}
function elegir(tab, id){
  elegidas[tab] = id;
  try{ localStorage.setItem(LSP, JSON.stringify(elegidas)); }catch(e){}
  pintar(); dibujarCarriles();
}
function dibujarCarriles(){
  $("carriles").innerHTML = ORDEN.map(t => `<h3>${NOMBRE[t]} <span>· ${pal(t).n}</span></h3><div class="carril" role="group" aria-label="Paleta de ${NOMBRE[t]}">` +
    PALETAS.map(p => `<button class="pal" data-tab-pal="${t}" data-pal="${p.id}" aria-pressed="${p.id === pal(t).id}" aria-label="${p.n} para ${NOMBRE[t]}">` +
      `<span class="mu"><i style="background:${p.c60}"></i><i style="background:${p.c30}"></i><i style="background:${p.c10}"></i></span><b>${p.n}</b><small>${p.k}</small></button>`).join("") + `</div>`).join("");
}
function hoja(el, abrir){
  el.classList.toggle("on", abrir); $("velo").classList.toggle("on", abrir);
  el.setAttribute("aria-hidden", !abrir);
  document.querySelector("nav").classList.toggle("oculta", abrir);
}
const cerrarHojas = () => document.querySelectorAll(".hoja.on").forEach(h => hoja(h, false));
function hojaColores(abrir){
  hoja($("hoja"), abrir);
  if (abrir){ dibujarCarriles(); $("cerrarColores").focus({ preventScroll:true }); }
}
$("abrirColores").onclick = () => hojaColores(true);
$("cerrarColores").onclick = $("velo").onclick = cerrarHojas;

/* ---------- Pendientes: calendario (Google Calendar vía el server) + agenda del día + pendientes de Condotec ---------- */
const LSAG = "jlp-agenda";
let AG = null, agSel = null, agMes = null; // se llenan con hoy al pintar (hoy se define más abajo)
const sumaDias = (s, n) => { const d = new Date(s + "T12:00"); d.setDate(d.getDate() + n); return d.toLocaleDateString("sv-SE"); };
const corto = s => new Date(s + "T12:00").toLocaleDateString("es-MX", { day:"numeric", month:"short" });
function eventosDe(dia){ // los de todo el día cuentan en cada día que abarcan
  return ((AG && AG.eventos) || []).filter(e => e.dia ? e.i.slice(0, 10) <= dia && dia < e.f.slice(0, 10) : e.i.slice(0, 10) === dia)
    .sort((a, b) => (a.dia ? "" : a.i).localeCompare(b.dia ? "" : b.i));
}
const pendDe = dia => ((AG && AG.pendientes) || []).filter(p => p.fecha === dia);
function pintarCal(){
  const primero = new Date(agMes + "-01T12:00"), off = (primero.getDay() + 6) % 7;
  const enMes = new Date(primero.getFullYear(), primero.getMonth() + 1, 0).getDate(), celdas = Math.ceil((off + enMes) / 7) * 7;
  const inicio = sumaDias(agMes + "-01", -off);
  $("calMes").textContent = primero.toLocaleDateString("es-MX", { month:"long", year:"numeric" }).replace(/^./, c => c.toUpperCase());
  $("calDias").innerHTML = [...Array(celdas)].map((_, i) => {
    const d = sumaDias(inicio, i), ev = eventosDe(d).slice(0, 3), pe = pendDe(d);
    const puntos = ev.map(e => `<i style="--col:${esc(e.col || "")}"></i>`).join("") + (pe.length ? `<i class="${d < hoy ? "venc" : "pend"}"></i>` : "");
    const cls = ["dia", d.slice(0, 7) !== agMes && "fuera", d === hoy && "hoy", d === agSel && "sel"].filter(Boolean).join(" ");
    return `<button class="${cls}" data-dia="${d}" aria-label="${corto(d)}${ev.length ? ", " + ev.length + " eventos" : ""}"><span>${+d.slice(8)}</span><span class="puntos">${puntos}</span></button>`;
  }).join("");
}
function pintarDia(){
  const fecha = new Date(agSel + "T12:00");
  $("agTitulo").textContent = agSel === hoy ? "Hoy" : agSel === sumaDias(hoy, 1) ? "Mañana" : fecha.toLocaleDateString("es-MX", { weekday:"long" }).replace(/^./, c => c.toUpperCase());
  $("agFecha").textContent = fecha.toLocaleDateString("es-MX", { day:"numeric", month:"long" });
  const ev = eventosDe(agSel), pe = pendDe(agSel);
  let h = ev.map(e => `<div class="evento" style="--col:${esc(e.col || "")}"><span class="barra"></span><span class="hora">${e.dia ? "Todo el día" : esc(e.i.slice(11, 16))}</span>` +
    `<span><b>${esc(e.t)}</b><small>${esc([e.c, e.l].filter(Boolean).join(" · "))}</small></span></div>`).join("");
  h += pe.map(p => `<div class="renglon"><div class="arriba"><b>${esc(p.n)}. ${esc(p.texto)}</b><span class="marca t-${agSel < hoy ? "rojo" : "azul"}">vence</span></div>${p.depas ? `<p>${esc(p.depas)}</p>` : ""}</div>`).join("");
  if (!h) h = AG && AG.eventos == null
    ? '<p class="nota">Tu Google Calendar todavía no llega al server: falta publicar el puente en Apps Script (Implementar → Versión nueva).</p>'
    : '<p class="nota">Nada en tu calendario este día.</p>';
  $("agDia").innerHTML = h;
}
function pintarPend(){
  const rango = p => p.fecha && p.fecha < hoy ? 0 : p.fecha ? 1 : 2, prio = p => ({ alta:0, media:1, baja:2 })[(p.prioridad || "").toLowerCase()] ?? 3;
  const lista = ((AG && AG.pendientes) || []).slice().sort((a, b) => rango(a) - rango(b) || (a.fecha || "").localeCompare(b.fecha || "") || prio(a) - prio(b));
  $("pendCuenta").textContent = lista.length ? lista.length + " abiertos" : "";
  $("agPend").innerHTML = lista.map(p => {
    const marca = p.fecha ? (p.fecha < hoy ? ["rojo", "vencido " + corto(p.fecha)] : ["azul", corto(p.fecha)]) : [prio(p) === 0 ? "ambar" : "gris", p.prioridad || "Sin fecha"];
    return `<div class="renglon"><div class="arriba"><b>${esc(p.n)}. ${esc(p.texto)}</b><span class="marca t-${marca[0]}">${esc(marca[1])}</span></div>` +
      `<p>${esc([p.estado, p.depas].filter(Boolean).join(" · "))}</p></div>`;
  }).join("") || '<p class="nota">Sin pendientes abiertos.</p>';
}
function pintarAgenda(){ agSel = agSel || hoy; agMes = agMes || hoy.slice(0, 7); if (AG){ pintarCal(); pintarDia(); pintarPend(); } }
function cargarAgenda(c){
  return api(c, "agenda", {}).then(r => { AG = r; try{ localStorage.setItem(LSAG, JSON.stringify(r)); }catch(e){} pintarAgenda(); })
    .catch(() => { if (!AG) $("agDia").innerHTML = '<p class="nota">No pude cargar tu agenda. Revisa tu conexión.</p>'; });
}
$("calDias").addEventListener("click", e => {
  const b = e.target.closest("[data-dia]"); if (!b) return;
  agSel = b.dataset.dia; agMes = agSel.slice(0, 7); pintarAgenda();
});
const moverMes = n => { if (!agMes) return; const d = new Date(agMes + "-01T12:00"); d.setMonth(d.getMonth() + n); agMes = d.toLocaleDateString("sv-SE").slice(0, 7); pintarCal(); };
$("mesAnt").onclick = () => moverMes(-1); $("mesSig").onclick = () => moverMes(1);

/* ---------- Tu día: Pendientes y Depas de Condotec (mismas cuentas que el panel de Fede, las hace el server) ---------- */
const LSPANEL = "jlp-panel";
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[ch]);
function seccionPanel(s){
  if (!s) return "";
  return `<div class="seccion"><h2>${esc(s.titulo)}</h2><span>${esc(s.resumen)}</span></div>` +
    `<div class="cifras">${(s.cifras || []).map(x => `<div class="cifra"><b class="t-${esc(x.tono)}">${esc(x.valor)}</b><small>${esc(x.rotulo)}</small></div>`).join("")}</div>` +
    `<div class="renglones">${(s.renglones || []).map(r => `<div class="renglon"><div class="arriba"><b>${esc(r.texto)}</b>` +
      (r.marca ? `<span class="marca t-${esc(r.tono || "gris")}">${esc(r.marca)}</span>` : "") + `</div>` +
      (r.detalle ? `<p>${esc(r.detalle)}</p>` : "") + `</div>`).join("")}</div>` +
    (s.nota ? `<p class="nota">${esc(s.nota)}</p>` : "");
}
function pintarPanel(p){
  $("panelCuerpo").innerHTML = seccionPanel(p.pendientes) + seccionPanel(p.depas);
  const alta = ((p.pendientes || {}).cifras || []).find(x => x.rotulo === "alta");
  const n = alta ? parseInt(alta.valor, 10) || 0 : 0;
  $("avisoPend").hidden = !n; $("avisoPend").textContent = n;
}
function cargarPanel(c){
  return api(c, "panel", { hoy }).then(p => { pintarPanel(p); try{ localStorage.setItem(LSPANEL, JSON.stringify(p)); }catch(e){} })
    .catch(() => { if (!localStorage.getItem(LSPANEL)) $("panelCuerpo").innerHTML = '<p class="nota">No pude cargar tus pendientes. Revisa tu conexión.</p>'; });
}
try{ const p = JSON.parse(localStorage.getItem(LSPANEL) || "null"); if (p) pintarPanel(p); }catch(e){}
$("restablecer").onclick = () => { elegidas = { ...DEF }; try{ localStorage.removeItem(LSP); }catch(e){} pintar(); dibujarCarriles(); };
$("carriles").addEventListener("click", e => { const b = e.target.closest("[data-pal]"); if (b) elegir(b.dataset.tabPal, b.dataset.pal); });
addEventListener("keydown", e => { if (e.key === "Escape") cerrarHojas(); });
const hoy = new Date().toLocaleDateString("sv-SE");
$("fecha").textContent = new Date().toLocaleDateString("es-MX", { weekday:"long", day:"numeric", month:"long" });

/* ---------- pestañas: cada app vive en su iframe, se crea la primera vez y se queda viva ---------- */
const vistas = { inicio:$("v-inicio"), condotec:$("v-condotec"), pendientes:$("v-pendientes") };
let actual = "inicio";
function vista(tab){
  if (!vistas[tab]){
    const f = document.createElement("iframe");
    f.className = "vista"; f.id = "v-" + tab; f.title = tab; f.src = tab + "/";
    f.setAttribute("role", "tabpanel");
    f.addEventListener("load", () => { pintarApp(tab); vigilarHojas(f); if (actual === tab) animarEntrada(f, 1); });
    document.body.insertBefore(f, document.querySelector("nav"));
    vistas[tab] = f;
  }
  return vistas[tab];
}
function ir(tab, push){
  if (!ORDEN.includes(tab)) tab = "inicio";
  const anterior = actual; actual = tab;
  document.documentElement.dataset.tab = tab;
  pintar();
  document.querySelectorAll("nav [role=tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.ir === tab));
  moverPastilla();
  const v = vista(tab), dir = Math.sign(ORDEN.indexOf(tab) - ORDEN.indexOf(anterior)) || 1;
  const vieja = anterior !== tab && vistas[anterior];
  if (vieja && !matchMedia("(prefers-reduced-motion: reduce)").matches){ // la anterior se queda visible mientras sale
    vieja.style.setProperty("--dir", dir);
    vieja.classList.remove("sale", "entra"); void vieja.offsetWidth; vieja.classList.add("sale");
    const fin = e => { if (e.target === vieja){ vieja.classList.remove("sale"); vieja.removeEventListener("animationend", fin); } };
    vieja.addEventListener("animationend", fin);
  }
  Object.values(vistas).forEach(x => x.classList.toggle("on", x === v));
  if (anterior !== tab) animarEntrada(v, dir);
  document.querySelector("nav").classList.remove("oculta");
  if (push !== false && location.hash !== "#" + tab) history.pushState(null, "", tab === "inicio" ? location.pathname : "#" + tab);
  if (anterior !== tab) refrescar();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-ir]"); if (b){ ir(b.dataset.ir); if (b.dataset.ancla) llevarA(b.dataset.ir, b.dataset.ancla); }
});
addEventListener("popstate", () => ir(location.hash.slice(1) || "inicio", false));

/* La pastilla mide y se mueve al botón activo (los botones se reparten el ancho de la pantalla). */
/* Mide la franja de iOS (pantalla menos alto de la página, solo en la app de pantalla de inicio): si existe, ahí ya va
   la rayita de inicio, así que la barra no necesita su margen de abajo. */
function medirFranja(){
  const f = navigator.standalone ? Math.max(0, Math.min(120, screen.height - innerHeight)) : 0;
  document.documentElement.style.setProperty("--franja", f + "px");
}
medirFranja(); addEventListener("resize", medirFranja);

function moverPastilla(){
  const b = document.querySelector(`nav [data-ir="${actual}"]`), p = $("pastilla");
  p.style.width = b.offsetWidth + "px"; p.style.transform = `translateX(${b.offsetLeft}px)`;
}
addEventListener("resize", moverPastilla);

/* La pantalla entra deslizándose desde el lado de la pestaña, y sus textos suben escalonados. */
function animarEntrada(v, dir){
  v.style.setProperty("--dir", dir || 1);
  v.classList.remove("entra"); void v.offsetWidth; v.classList.add("entra");
  try{
    const d = v.tagName === "IFRAME" ? v.contentDocument.documentElement : null;
    if (d){ d.classList.remove("entra"); void d.offsetWidth; d.classList.add("entra"); }
  }catch(e){}
}

/* Un toque en el Inicio lleva a la pestaña y a la parte exacta (p. ej. la tarjeta de WHOOP del Tracker). */
function llevarA(tab, ancla){
  const f = vistas[tab];
  const ve = () => { try{ const el = f.contentDocument.getElementById(ancla); if (el && !el.hidden) el.scrollIntoView({ behavior:"smooth", block:"start" }); }catch(e){} };
  if (f.contentDocument && f.contentDocument.readyState === "complete") setTimeout(ve, 250); else f.addEventListener("load", () => setTimeout(ve, 600), { once:true });
}

/* Mientras una app tiene abierta su hoja de abajo, se esconde la barra de pestañas para no taparla. */
function vigilarHojas(f){
  try{
    const doc = f.contentDocument, nav = document.querySelector("nav");
    new MutationObserver(() => nav.classList.toggle("oculta", vistas[actual] === f && !!doc.querySelector(".sheet.open")))
      .observe(doc.body, { subtree:true, attributes:true, attributeFilter:["class"] });
  }catch(e){}
}

/* ---------- tiempo real: al cambiar de pestaña, al volver a la app y cada 30 s ---------- */
function refrescar(){
  if (document.hidden) return;
  if (actual === "inicio") { const c = cfg(); if (c) cargar(c); return; }
  if (actual === "condotec") { const c = cfg(); if (c) cargarPanel(c); return; }
  if (actual === "pendientes") { const c = cfg(); if (c) cargarAgenda(c); return; }
  try{ const d = vistas[actual].contentDocument; if (d && d.readyState === "complete") d.dispatchEvent(new Event("visibilitychange")); }catch(e){}
}
document.addEventListener("visibilitychange", refrescar);
setInterval(refrescar, 30000);

/* ---------- Inicio ---------- */
function cfg(){
  const p = new URLSearchParams(location.search);
  if (p.get("u") && p.get("k")) { const c = { u:p.get("u"), k:p.get("k") }; try{ localStorage.setItem(LS, JSON.stringify(c)); }catch(e){} history.replaceState(null, "", location.pathname + location.hash); return c; }
  try{ return JSON.parse(localStorage.getItem(LS) || "null"); }catch(e){ return null; }
}
async function api(c, tool, input){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify({ k:c.k, tool, input }) });
  const j = await r.json(); if (j.error) throw new Error(j.error); return j.result;
}
const leer = (c, sheet, range) => api(c, "get_values", { spreadsheetId:sheet, range }).then(r => r.values || []);
const num = v => typeof v === "number" ? v : parseFloat(String(v||"").replace(/[^0-9.\-]/g, ""));
const fecha = v => String(v||"").replace(/^'/, "").slice(0, 10);
const pesos = n => "$" + Math.round(n).toLocaleString("es-MX");

function barras(serie){
  const D = ["Do","Lu","Ma","Mi","Ju","Vi","Sá"];
  // cada barra lleva su valor arriba; el día más alto se resalta con el acento
  const vals = serie.map(x => x.v).filter(isFinite), mx = vals.length ? Math.max(...vals) : NaN;
  $("bars").innerHTML = serie.map(x => { const ok = isFinite(x.v);
    return `<div class="col${ok && x.v === mx ? " max" : ""}${ok ? "" : " vacio"}" title="${x.d}: ${ok ? Math.round(x.v) + "%" : "sin dato"}">` +
      `<span class="chip">${ok ? Math.round(x.v) : "–"}</span><i style="height:${ok ? Math.max(6, x.v * .8) : 6}%"></i></div>`; }).join("");
  $("dias").innerHTML = serie.map(x => `<span>${D[new Date(x.d+"T12:00").getDay()]}</span>`).join("");
}
function ultimos7(){ return [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return d.toLocaleDateString("sv-SE"); }); }
barras(ultimos7().map(d => ({ d, v:NaN })));

/* El server ya tiene el resumen listo (herramienta "resumen" de puente.py): una sola consulta chica.
   Lo último que llegó se guarda en el teléfono y se pinta al abrir, antes de preguntar nada. */
const LSR = "jlp-resumen";
function poner(id, txt){
  const el = $(id); el._cuenta = null; // si estaba contando, el dato nuevo manda
  if (el.textContent === txt) return;
  el.textContent = txt; el.classList.remove("nuevo"); void el.offsetWidth; el.classList.add("nuevo");
}
function mostrar(r){ // { serie:[[fecha, recovery]], rec, recFecha, sueno, hrv, gastoHoy, gastoMes }
  const v = Object.fromEntries(r.serie || []);
  barras(ultimos7().map(d => ({ d, v:v[d] == null ? NaN : v[d] })));
  poner("rec", r.rec == null ? "–" : String(Math.round(r.rec)));
  $("recNota").textContent = !r.recFecha ? "" : r.recFecha === hoy ? "hoy" : "del " + new Date(r.recFecha + "T12:00").toLocaleDateString("es-MX", { day:"numeric", month:"short" });
  // Anillos WHOOP (la parte llena es el avance) y abajo pasos, calorías y gastos. Sin dato: no se muestra.
  const entero = x => Math.round(x).toLocaleString("es-MX");
  const arco = (id, p) => { $("arco-" + id).style.strokeDasharray = `${p == null ? 0 : Math.max(0, Math.min(100, p))} 100`; };
  poner("suenoPct", r.suenoPct == null ? "–" : String(Math.round(r.suenoPct))); arco("suenoPct", r.suenoPct);
  arco("rec", r.rec);
  poner("strain", r.strain == null ? "–" : r.strain.toFixed(1)); arco("strain", r.strain == null ? null : r.strain / 21 * 100);
  poner("hrv", r.hrv == null ? "–" : entero(r.hrv));
  poner("sueno", r.sueno == null ? "–" : r.sueno.toFixed(1));
  const stat = (id, x, f, pct) => {
    const b = $(id).closest(".stat"); b.hidden = x == null;
    if (x != null){ poner(id, f(x)); if (pct) b.style.setProperty("--p", Math.max(3, Math.min(100, pct(x)))); }
  };
  stat("pasos", r.pasos, entero, x => x / 10000 * 100);
  stat("kcal", r.kcal, entero, x => x / 3500 * 100);
  stat("gasto", r.gastoHoy || 0, pesos);
  stat("semana", r.gastoSemana || 0, pesos);
  const vis = [...document.querySelectorAll(".cuatro .stat")].filter(s => !s.hidden); // 3 tarjetas: en una sola fila
  $("pasos").closest(".cuatro").classList.toggle("tres", vis.length === 3);
}
/* Respaldo por si el server todavía no tiene "resumen": lo arma con las dos pestañas completas. */
async function resumenLento(c){
  const [w, m] = await Promise.all([leer(c, TRACKER, "Whoop!A:O"), leer(c, FIN, "Movimientos!A:F")]);
  const porDia = {}; w.slice(1).forEach(r => { if (r[0]) porDia[fecha(r[0])] = r; });
  const filas = Object.keys(porDia).sort().map(k => porDia[k]);
  const u = filas.filter(r => isFinite(num(r[6]))).pop() || [];
  const ayer = (() => { const d = new Date(); d.setDate(d.getDate() - 1); return d.toLocaleDateString("sv-SE"); })();
  const ultimo = i => { const r = filas.filter(r => fecha(r[0]) >= ayer && isFinite(num(r[i]))).pop(); return r ? num(r[i]) : null; };
  const gastos = m.slice(1).filter(r => !/pago de tarjeta|transferencia/i.test(r[3] || "")).map(r => ({ d:fecha(r[0]), m:num(r[5]) })).filter(x => isFinite(x.m) && x.m < 0);
  const ok = x => isFinite(x) ? x : null;
  const lunes = (() => { const d = new Date(); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.toLocaleDateString("sv-SE"); })();
  return { serie:ultimos7().map(d => [d, ok(num((porDia[d] || [])[6]))]), rec:ok(num(u[6])), recFecha:u[0] ? fecha(u[0]) : null,
    sueno:ultimo(3), suenoPct:ultimo(5), hrv:ultimo(7), kcal:ultimo(10), pasos:ultimo(14), gastoHoy:-gastos.filter(x => x.d === hoy).reduce((a, x) => a + x.m, 0),
    gastoMes:-gastos.filter(x => x.d.slice(0, 7) === hoy.slice(0, 7)).reduce((a, x) => a + x.m, 0),
    gastoSemana:-gastos.filter(x => x.d >= lunes && x.d <= hoy).reduce((a, x) => a + x.m, 0) };
}
function cargar(c){
  api(c, "resumen", { hoy }).catch(() => resumenLento(c)).then(r => {
    mostrar(r);
    try{ localStorage.setItem(LSR, JSON.stringify(r)); }catch(e){}
  }).catch(() => {});
}
try{ const r = JSON.parse(localStorage.getItem(LSR) || "null"); if (r) mostrar(r); }catch(e){}

const c = cfg();
if (!c){
  $("conectar").hidden = false;
  $("conectar").onclick = () => {
    const s = (prompt("Pega tu link de configuración o tu clave") || "").trim();
    if (!s) return;
    let k = s; // vale el link completo (?u=...&k=...) o solo la clave
    try{ k = new URL(s).searchParams.get("k") || s; }catch(e){}
    try{ localStorage.setItem(LS, JSON.stringify({ u:"jlpog", k })); }catch(e){}
    location.reload();
  };
}
/* ---------- entrada con estilo: al abrir la app y al volver después de 5 min ---------- */
function contar(el, demora){ // "$5,044" → cuenta de $0 a $5,044 conservando el formato
  const txt = el.textContent, m = txt.match(/-?[\d,]+(\.\d+)?/);
  if (!m) return;
  const fin = parseFloat(m[0].replace(/,/g, "")), dec = (m[1] || "").length - (m[1] ? 1 : 0);
  const fmt = x => x.toLocaleString("en-US", { minimumFractionDigits:dec, maximumFractionDigits:dec });
  const yo = el._cuenta = {}, t0 = performance.now() + demora, dur = 900;
  const paso = t => {
    if (el._cuenta !== yo) return;
    const p = Math.min(1, Math.max(0, (t - t0) / dur)), e = 1 - Math.pow(1 - p, 3);
    el.textContent = txt.replace(m[0], fmt(fin * e));
    if (p < 1) requestAnimationFrame(paso); else { el.textContent = txt; el._cuenta = null; }
  };
  el.textContent = txt.replace(m[0], fmt(0));
  requestAnimationFrame(paso);
}
function intro(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || actual !== "inicio") return;
  const v = $("v-inicio"), raiz = document.documentElement;
  v.classList.remove("intro", "entra"); raiz.classList.remove("intro-on"); void v.offsetWidth;
  v.classList.add("intro"); raiz.classList.add("intro-on");
  contar($("rec"), 400);
  contar($("suenoPct"), 550); contar($("strain"), 750);
  ["pasos", "kcal", "gasto", "semana"].map($).filter(n => !n.closest(".stat").hidden).forEach((n, i) => contar(n, 950 + i * 80));
  // los anillos se dibujan desde cero
  document.querySelectorAll(".aro .arco").forEach(a => { const d = a.style.strokeDasharray; a.style.transition = "none"; a.style.strokeDasharray = "0 100";
    void a.getBoundingClientRect(); a.style.transition = ""; setTimeout(() => { a.style.strokeDasharray = d; }, 500); });
  clearTimeout(intro.t); intro.t = setTimeout(() => { v.classList.remove("intro"); raiz.classList.remove("intro-on"); }, 2400);
}
let ocultoDesde = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) ocultoDesde = Date.now();
  else if (ocultoDesde && Date.now() - ocultoDesde > 5 * 60000) intro();
});

ir(location.hash.slice(1) || "inicio", false);
if (c) cargar(c);
intro();
try{ AG = JSON.parse(localStorage.getItem(LSAG) || "null"); pintarAgenda(); }catch(e){} // agenda guardada: se ve al instante
if (c) setTimeout(() => cargarPanel(c), 1200); // el aviso del logo se actualiza sin estorbar la carga del Inicio
/* Las otras pestañas se preparan por detrás en cuanto el Inicio ya se ve, para que al tocarlas abran al instante. */
if (c) (window.requestIdleCallback || (f => setTimeout(f, 600)))(() => ORDEN.forEach(vista), { timeout:1500 });
</script>
