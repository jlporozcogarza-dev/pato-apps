<!doctype html><html lang="es" data-tab="inicio"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer">
<title>JLP</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="JLP">
<meta name="theme-color" content="#1C1C1C" id="themeColor">
<link rel="apple-touch-icon" href="tracker/icon-180.png"><link rel="icon" href="tracker/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* JLP: una sola app con pestañas. Colores tradicionales japoneses (nippon iro) con la regla 60-30-10:
   60 = fondo, 30 = tarjetas de vidrio, 10 = acento. Tracker y Finanzas usan las mismas paletas (build.py, PALETAS). */
@property --c60{syntax:"<color>";inherits:true;initial-value:#1C1C1C}
@property --c30{syntax:"<color>";inherits:true;initial-value:#535953}
@property --c10{syntax:"<color>";inherits:true;initial-value:#BEC23F}
:root{color-scheme:dark;--fg:#F4F1EA;--muted:#ABA69D;--blur:blur(28px) saturate(160%);
  transition:--c60 .6s ease,--c30 .6s ease,--c10 .6s ease}
[data-tab=inicio]{--c60:#1C1C1C;--c30:#535953;--c10:#BEC23F}   /* 墨 Sumi · 青鈍 Aonibi · 鶸 Hiwa */
[data-tab=tracker]{--c60:#1E1512;--c30:#B54434;--c10:#F17C67}  /* 鳶 Tobi · 紅樺 Benikaba · 珊瑚朱 Sangoshu */
[data-tab=finanzas]{--c60:#08192D;--c30:#566C73;--c10:#A8D8B9} /* 褐 Kachi · 藍鼠 Ainezumi · 白緑 Byakuroku */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--c60);color:var(--fg);font:16px/1.35 Outfit,system-ui,sans-serif}
.fondo{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(48% 32% at 90% 4%,color-mix(in srgb,var(--c10) 26%,transparent),transparent 70%),
             radial-gradient(56% 36% at 0% 46%,color-mix(in srgb,var(--c30) 34%,transparent),transparent 70%),
             radial-gradient(50% 30% at 96% 92%,color-mix(in srgb,var(--c30) 22%,transparent),transparent 70%),var(--c60)}
.vista{position:fixed;inset:0;z-index:1;border:0;width:100%;height:100%;background:transparent;display:none}
.vista.on{display:block}
iframe.vista{top:env(safe-area-inset-top);height:calc(100% - env(safe-area-inset-top))}
#v-inicio{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(18px,env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}
main{max-width:460px;margin:0 auto}
button{font:inherit;color:inherit}
.glass{background:linear-gradient(180deg,color-mix(in srgb,var(--c30) 30%,transparent),color-mix(in srgb,var(--c30) 16%,transparent));
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid color-mix(in srgb,var(--c30) 45%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 18px 40px -20px rgba(0,0,0,.75)}
header{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.logo{width:46px;height:46px;border-radius:15px;color:var(--c10);display:grid;place-items:center;font-weight:600;font-size:15px;letter-spacing:.03em}
header p{margin:0;font-weight:500;font-size:18px}
header small{color:var(--muted);font-size:13px}
header small::first-letter{text-transform:uppercase}
.hero{position:relative;display:block;width:100%;text-align:left;overflow:hidden;border-radius:28px;padding:18px 18px 16px;margin-bottom:12px;cursor:pointer}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.12) 0%,transparent 30%)}
.row{display:flex;justify-content:space-between;align-items:center}
.hero .t{font-size:17px;font-weight:500}
.hero .p{font-size:13px;color:var(--muted)}
.big{font-size:60px;font-weight:300;letter-spacing:-.035em;line-height:1;margin:14px 0 4px;display:flex;align-items:baseline;gap:10px;color:var(--c10)}
.big small{font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;margin-top:14px}
.bars i{display:block;border-radius:14px;min-height:10px;transition:height .6s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c30) 75%,#fff 10%),color-mix(in srgb,var(--c30) 40%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.bars i.hoy{background:linear-gradient(180deg,var(--c10),color-mix(in srgb,var(--c10) 55%,transparent));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 22px -8px var(--c10)}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px;font-size:12px;text-align:center;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;border-radius:24px;padding:16px;min-height:136px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer}
.tile .n{font-size:clamp(30px,9vw,40px);padding-right:20px;white-space:nowrap;font-weight:300;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:14px;color:var(--muted);line-height:1.25}
.arrow{position:absolute;top:14px;right:14px;width:18px;height:18px;color:var(--muted);transition:transform .2s ease,color .2s ease}
.hero,.tile{-webkit-user-select:none;user-select:none;transition:transform .2s ease}
.hero:active,.tile:active{transform:scale(.98)}
@media (hover:hover){.tile:hover,.hero:hover{transform:translateY(-2px)}.tile:hover .arrow{color:var(--c10);transform:translate(2px,-2px)}}
nav{position:fixed;z-index:5;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:24px;transition:opacity .2s,transform .25s}
nav.oculta{opacity:0;pointer-events:none;transform:translate(-50%,24px)}
nav button{width:58px;height:48px;border:0;border-radius:18px;display:grid;place-items:center;background:none;color:#D4D0C8;cursor:pointer;transition:background .25s,color .25s}
nav button[aria-selected=true]{background:linear-gradient(180deg,color-mix(in srgb,var(--c10) 80%,#fff),var(--c10));color:var(--c60);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 18px -6px var(--c10)}
nav svg{width:22px;height:22px}
:focus-visible{outline:2px solid var(--c10);outline-offset:3px}
.conectar{margin-top:14px;width:100%;padding:14px;border-radius:18px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div class="fondo" aria-hidden="true"></div>

<div class="vista on" id="v-inicio" role="tabpanel" aria-label="Inicio"><main>
<header>
  <div class="logo glass" aria-hidden="true">JLP</div>
  <div><p>Hola, Pato</p><small id="fecha">Hoy</small></div>
</header>
<button class="hero glass" data-ir="tracker" aria-label="Abrir Tracker">
  <div class="row"><span class="t">Recovery</span><span class="p">Últimos 7 días</span></div>
  <div class="big"><span id="rec">–</span><small id="recNota"></small></div>
  <div class="bars" id="bars"></div>
  <div class="dias" id="dias"></div>
</button>
<section class="grid">
  <button class="tile glass" data-ir="finanzas"><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg><span class="n" id="gasto">–</span><span class="l">gastado<br>hoy</span></button>
  <button class="tile glass" data-ir="tracker"><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg><span class="n" id="sueno">–</span><span class="l">horas de<br>sueño</span></button>
  <button class="tile glass" data-ir="tracker"><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg><span class="n" id="hrv">–</span><span class="l">HRV<br>(ms)</span></button>
  <button class="tile glass" data-ir="finanzas"><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg><span class="n" id="mes">–</span><span class="l">gastado<br>este mes</span></button>
</section>
<button class="conectar glass" id="conectar" hidden>Conectar mis datos</button>
</main></div>

<nav class="glass" role="tablist" aria-label="Secciones">
  <button role="tab" data-ir="inicio" aria-selected="true" aria-label="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg></button>
  <button role="tab" data-ir="tracker" aria-selected="false" aria-label="Tracker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg></button>
  <button role="tab" data-ir="finanzas" aria-selected="false" aria-label="Finanzas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg></button>
</nav>

<script>
/* Misma configuración que tracker y finanzas (mismo sitio, misma llave "pato-puente"). */
const LS = "pato-puente", API = "https://api.jlpog.app/";
const TRACKER = "1L90iaeKk-U3Y7siZ4h7pFOfguUrEbK4IVvqk1YEuFFM", FIN = "1Wj1YoOCuqjQB-4rtikdTKAhFRCSRloNsWJeLMez4vic";
const C60 = { inicio:"#1C1C1C", tracker:"#1E1512", finanzas:"#08192D" };
const $ = id => document.getElementById(id);
const hoy = new Date().toLocaleDateString("sv-SE");
$("fecha").textContent = new Date().toLocaleDateString("es-MX", { weekday:"long", day:"numeric", month:"long" });

/* ---------- pestañas: cada app vive en su iframe, se crea la primera vez y se queda viva ---------- */
const vistas = { inicio:$("v-inicio") };
let actual = "inicio";
function vista(tab){
  if (!vistas[tab]){
    const f = document.createElement("iframe");
    f.className = "vista"; f.id = "v-" + tab; f.title = tab; f.src = tab + "/";
    f.setAttribute("role", "tabpanel");
    f.addEventListener("load", () => vigilarHojas(f));
    document.body.insertBefore(f, document.querySelector("nav"));
    vistas[tab] = f;
  }
  return vistas[tab];
}
function ir(tab, push){
  if (!vistas[tab] && !["tracker","finanzas","inicio"].includes(tab)) tab = "inicio";
  const anterior = actual; actual = tab;
  document.documentElement.dataset.tab = tab;
  $("themeColor").content = C60[tab];
  document.querySelectorAll("nav [role=tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.ir === tab));
  const v = vista(tab);
  Object.values(vistas).forEach(x => x.classList.toggle("on", x === v));
  document.querySelector("nav").classList.remove("oculta");
  if (push !== false && location.hash !== "#" + tab) history.pushState(null, "", tab === "inicio" ? location.pathname : "#" + tab);
  if (anterior !== tab) refrescar();
}
document.addEventListener("click", e => { const b = e.target.closest("[data-ir]"); if (b) ir(b.dataset.ir); });
addEventListener("popstate", () => ir(location.hash.slice(1) || "inicio", false));

/* Mientras una app tiene abierta su hoja de abajo, se esconde la barra de pestañas para no taparla. */
function vigilarHojas(f){
  try{
    const doc = f.contentDocument, nav = document.querySelector("nav");
    new MutationObserver(() => nav.classList.toggle("oculta", vistas[actual] === f && !!doc.querySelector(".sheet.open")))
      .observe(doc.body, { subtree:true, attributes:true, attributeFilter:["class"] });
  }catch(e){}
}

/* ---------- tiempo real: al cambiar de pestaña, al volver a la app y cada 30 s ---------- */
function refrescar(){
  if (document.hidden) return;
  if (actual === "inicio") { const c = cfg(); if (c) cargar(c); return; }
  try{ const d = vistas[actual].contentDocument; if (d && d.readyState === "complete") d.dispatchEvent(new Event("visibilitychange")); }catch(e){}
}
document.addEventListener("visibilitychange", refrescar);
setInterval(refrescar, 30000);

/* ---------- Inicio ---------- */
function cfg(){
  const p = new URLSearchParams(location.search);
  if (p.get("u") && p.get("k")) { const c = { u:p.get("u"), k:p.get("k") }; try{ localStorage.setItem(LS, JSON.stringify(c)); }catch(e){} history.replaceState(null, "", location.pathname + location.hash); return c; }
  try{ return JSON.parse(localStorage.getItem(LS) || "null"); }catch(e){ return null; }
}
async function leer(c, sheet, range){
  const r = await fetch(API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify({ k:c.k, tool:"get_values", input:{ spreadsheetId:sheet, range } }) });
  const j = await r.json(); if (j.error) throw new Error(j.error); return j.result.values || [];
}
const num = v => typeof v === "number" ? v : parseFloat(String(v||"").replace(/[^0-9.\-]/g, ""));
const fecha = v => String(v||"").replace(/^'/, "").slice(0, 10);
const pesos = n => "$" + Math.round(n).toLocaleString("es-MX");

function barras(serie){
  const D = ["Do","Lu","Ma","Mi","Ju","Vi","Sá"];
  $("bars").innerHTML = serie.map(x => `<i class="${x.d===hoy?"hoy":""}" style="height:${isFinite(x.v)?Math.max(8,x.v):8}%" title="${x.d}: ${isFinite(x.v)?x.v+"%":"sin dato"}"></i>`).join("");
  $("dias").innerHTML = serie.map(x => `<span>${D[new Date(x.d+"T12:00").getDay()]}</span>`).join("");
}
function ultimos7(){ return [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return d.toLocaleDateString("sv-SE"); }); }
barras(ultimos7().map(d => ({ d, v:NaN })));

function cargar(c){
  leer(c, TRACKER, "Whoop!A:H").then(rows => {
    const porDia = {}; rows.slice(1).forEach(r => { if (r[0]) porDia[fecha(r[0])] = r; });
    barras(ultimos7().map(d => ({ d, v:num((porDia[d]||[])[6]) })));
    const u = Object.keys(porDia).sort().map(k => porDia[k]).filter(r => isFinite(num(r[6]))).pop();
    if (!u) return;
    $("rec").textContent = num(u[6]) + "%";
    $("recNota").textContent = fecha(u[0]) === hoy ? "hoy" : "del " + new Date(fecha(u[0])+"T12:00").toLocaleDateString("es-MX",{ day:"numeric", month:"short" });
    const h = num(u[3]); if (isFinite(h)) $("sueno").textContent = h.toFixed(1);
    const hrv = num(u[7]); if (isFinite(hrv)) $("hrv").textContent = Math.round(hrv);
  }).catch(() => {});
  leer(c, FIN, "Movimientos!A:F").then(rows => {
    const gastos = rows.slice(1).filter(r => !/pago de tarjeta|transferencia/i.test(r[3] || "")).map(r => ({ d:fecha(r[0]), m:num(r[5]) })).filter(x => isFinite(x.m) && x.m < 0);
    $("gasto").textContent = pesos(-gastos.filter(x => x.d === hoy).reduce((a, x) => a + x.m, 0));
    $("mes").textContent = pesos(-gastos.filter(x => x.d.slice(0, 7) === hoy.slice(0, 7)).reduce((a, x) => a + x.m, 0));
  }).catch(() => {});
}

const c = cfg();
if (!c){
  $("conectar").hidden = false;
  $("conectar").onclick = () => {
    const s = prompt("Pega el link de configuración que te mandó Claude");
    try{ const u = new URL(s.trim()).searchParams; if (u.get("u") && u.get("k")) { localStorage.setItem(LS, JSON.stringify({ u:u.get("u"), k:u.get("k") })); location.reload(); } }catch(e){}
  };
}
ir(location.hash.slice(1) || "inicio", false);
if (c) cargar(c);
</script>
</body></html>
